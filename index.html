<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>スカイホッパー</title>
<meta name="theme-color" content="#2b2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スカイホッパー">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --navy: #0a1230;
    --deep: #05070f;
    --sky: #4aa3e8;
    --lime: #7ee08a;
    --amber: #ff9a3d;
    --cyan: #3dd6f5;
    --paper: #eef3f8;
    --bg: var(--deep);
  }
  :root:not([data-theme="light"]) { --bg: var(--deep); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: var(--deep); }
  }
  :root[data-theme="dark"] { --bg: var(--deep); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* ホーム画面から開くと %・dvh は 873 しか渡らず下に帯が出る(実機 描ける873 / vh932)。
     根っこを 100vh にし、position: relative で全画面の入れ物(#stage)の基準にする。
     relative が無いと absolute の基準が iOS の渡す枠(873)のままになる(金箔ひらひらと同じ直し方) */
  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100vh;
    position: relative;
    background: var(--bg); overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--paper);
  }
  #stage { position: absolute; inset: 0; }
  #board { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* ステージの背景の絵(stage-bg.jpg 852x1846、画面と同じ比)。1.5倍に広げて上下に流す。
     位置は transform だけで動かす(毎コマ描き直さず、合成だけで済む) */
  /* 宇宙ステーションより上の背景(space-bg.jpg 941x1671)。ステージの絵の奥に敷き、2000m を過ぎて
     ステージの絵が下へ流れて消えると現れる */
  /* 10000m(星の港)より上は、明るい宇宙の絵(space2-bg.jpg)を手前に重ねて切り替える */
  .spimg { position: absolute; left: 0; top: 0; height: auto; transform-origin: 0 0; opacity: 0; pointer-events: none; }
  #bgimg {
    position: absolute; left: 0; top: 0; width: 100%; height: auto; transform-origin: 50% 0; opacity: 0; pointer-events: none;
    /* 2000m より上で絵が下へ流れると上端が見える。くっきりした横線にならないよう、上端をぼかす */
    -webkit-mask-image: linear-gradient(transparent, #000 6%); mask-image: linear-gradient(transparent, #000 6%);
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 62px 0 14px;
    display: flex; align-items: baseline; gap: 12px;
    pointer-events: none; z-index: 5;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .h-num { font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #fff; font-variant-numeric: tabular-nums; }
  .h-unit { font-size: 13px; opacity: .75; margin-left: 3px; font-weight: 600; }
  .h-best { margin-left: auto; font-size: 12px; opacity: .7; font-weight: 600; }

  .pausebtn {
    position: absolute; z-index: 6;
    top: calc(env(safe-area-inset-top) + 8px); right: 14px;
    width: 38px; height: 38px; padding: 0; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    box-shadow: none; pointer-events: auto;
  }
  .pausebtn.show { display: flex; }

  .veil {
    position: absolute; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, rgba(10,18,48,.86), rgba(5,7,15,.96));
  }
  .veil.on { display: flex; }
  .card { text-align: center; padding: 26px 22px; max-width: 320px; }
  /* ===== タイトル(明るい空の上に、キャラの札を4枚) ===== */
  /* タイトルまわりの間は、上の高さ表示を隠す(明るい空の上に 0m が浮いて見える) */
  #board:has(#vStart.on) .hud, #board:has(#vChars.on) .hud, #board:has(#vMenu.on) .hud { visibility: hidden; }
  #vStart { display: none; background: none; }
  #vStart.on { display: block; }
  /* 後ろのタイトルの絵にはボタンが描いてある。押せそうに見えないよう、ぼかす */
  #vChars {
    background: rgba(24,30,96,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    align-items: flex-start; overflow-y: auto;
  }
  .tcard {
    position: relative; width: 100%; margin: auto 0; text-align: center;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 6px);
  }
  /* タイトルの絵(title-v2.jpg 852x1846)は画面(430x932)と同じ縦横比なので、画面いっぱいに敷く。
     押し場所は絵の上の割合で決める(画面と絵がほぼ同じ比なので、そのまま画面の割合になる) */
  .tart { position: absolute; inset: 0; }
  /* 絵に描いてあるボタンの上に重ねる、見えない押し場所 */
  button.hot {
    position: absolute; padding: 0; margin: 0; border: 0; border-radius: 999px;
    background: transparent; box-shadow: none; color: transparent;
  }
  button.hot:active { background: rgba(255,255,255,.28); transform: none; }
  #bStart { left: 19.4%; top: 78.8%; width: 59.8%; height: 7.4%; }
  #bChars { left: 15.6%; top: 88.2%; width: 32.9%; height: 6%; }
  #bShop { left: 51.9%; top: 88.4%; width: 32.5%; height: 5.5%; }
  /* 絵に無い歯車とコインは、ロゴの矢印にかからない上の左右に置く */
  .gear {
    position: absolute; right: 12px; top: calc(env(safe-area-inset-top) + 4px);
    width: 42px; height: 42px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(30,80,190,.35); border: 2px solid rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(20,60,150,.25);
  }
  .gear svg { width: 24px; height: 24px; }
  .tcoin {
    position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 6px);
    display: flex; align-items: center; gap: 6px; padding: 3px 14px 3px 4px;
    border-radius: 999px; background: rgba(30,80,190,.4); border: 2px solid rgba(255,255,255,.8);
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(10,40,120,.5);
  }
  .coin-ico {
    width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #fff3a0, #ffc21a 55%, #e89a00); box-shadow: inset 0 0 0 2px #ffe27a;
    color: #fff; font-size: 13px; text-shadow: 0 1px 1px rgba(180,100,0,.6);
  }
  /* 持ち物の札はスタートのすぐ上、版はいちばん下 */
  #vStart .item-toggles { position: absolute; left: 0; right: 0; bottom: calc(21.2% + 8px); margin: 0; }
  #vStart .ver { position: absolute; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; }
  .item-toggles { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .item-toggles:empty { display: none; }
  .itog {
    font-size: 12px; padding: 6px 11px; border-radius: 999px; letter-spacing: 0; box-shadow: none;
    color: #fff; background: rgba(70,50,150,.45); border: 1px solid rgba(255,255,255,.6);
  }
  .itog.on { background: #fff; color: #5a3aa8; border-color: #fff; }
  #vStart .ver { color: #fff; opacity: .8; text-shadow: 0 1px 2px rgba(20,40,110,.6); }
  #vChars h2 {
    margin: 6px 0 12px; font-size: 26px; color: #fff; letter-spacing: .08em;
    text-shadow: 0 2px 0 #3f6fd8, 0 4px 10px rgba(20,40,130,.4);
  }
  #bCharsOk { width: 220px; border-radius: 999px; font-size: 18px; color: #fff; background: linear-gradient(#8a93ff, #5a64ea);
    border: 3px solid rgba(255,255,255,.85); box-shadow: 0 5px 0 #3f47c2; }
  .menu-list { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
  .menu-list button.ghost { margin: 0; font-size: 15px; padding: 12px 18px; }
  .menu-list .tcount { opacity: .6; font-size: 12px; margin-left: 4px; }
  .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .ccard {
    position: relative; border-radius: 18px; overflow: hidden; cursor: pointer; text-align: center;
    background: linear-gradient(#fff, #f3f6ff); color: #2a3350;
    box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 6px 16px rgba(40,50,120,.25);
    display: flex; flex-direction: column;
  }
  .ccard.on { box-shadow: 0 0 0 4px #ffd84a, 0 0 0 7px rgba(255,255,255,.9), 0 8px 22px rgba(255,160,60,.55); }
  .ccard .band {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 4px 5px; color: #fff; font-size: 12.5px; font-weight: 800; letter-spacing: .06em;
    text-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .ccard .band svg { width: 16px; height: 16px; flex: none; }
  .ccard .cname { margin: 6px 0 0; font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .ccard .art { position: relative; height: 100px; display: flex; justify-content: center; }
  .ccard .art::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 96px; height: 70px; margin: -30px 0 0 -48px;
    border-radius: 50%; background: radial-gradient(closest-side, var(--tint), rgba(255,255,255,0));
  }
  .ccard .art canvas { position: relative; margin-top: -4px; }
  .ccard.on .art canvas { animation: hop 1.1s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .ccard .cdesc { margin: 0 10px; font-size: 10.5px; line-height: 1.5; min-height: 3em; font-weight: 600; opacity: .8; }
  .ccard .states {
    display: flex; justify-content: center; gap: 6px; margin: 6px 8px 8px; padding: 3px 0 3px;
    border-radius: 12px; background: var(--wash);
  }
  .ccard .states div { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 700; opacity: .85; }
  /* 封じてある札は色を残したまま暗幕を一枚かける(filter で沈めると上の印まで沈む) */
  .ccard .seal {
    position: absolute; left: 0; right: 0; bottom: 0; top: 29px;
    background: rgba(40,30,90,.42); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 52px;
  }
  .ccard .seal div {
    padding: 8px 14px; border-radius: 14px; background: rgba(34,26,80,.9); border: 1px solid rgba(255,255,255,.35);
    color: #fff; font-size: 15px; font-weight: 800; line-height: 1.35;
  }
  .ccard .seal small { display: block; font-size: 10.5px; font-weight: 700; opacity: .85; }
  .card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
  .card p { margin: 0 0 20px; font-size: 14px; line-height: 1.85; opacity: .82; }
  .card .big { font-size: 46px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .card .note { color: var(--sky); font-size: 14px; font-weight: 600; min-height: 1.4em; margin: 2px 0 16px; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .04em;
    color: #04121f; background: linear-gradient(180deg, #7fdcff, var(--sky));
    border: 0; border-radius: 12px; padding: 14px 36px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(74,163,232,.35);
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button:active { transform: translateY(1px); }
  button.ghost {
    margin-top: 12px; background: none; color: var(--paper);
    box-shadow: none; border: 1px solid rgba(255,255,255,.3);
    font-size: 13px; padding: 9px 20px; opacity: .85;
  }
  .coinbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 10px; }
  .coin-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .coin-pill.big-pill { font-size: 16px; padding: 7px 16px; margin: 2px 0 14px; }

  .shop-card { max-width: 340px; }
  .shop-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: min(400px, 55vh); overflow-y: auto;
    margin-bottom: 16px; text-align: left;
  }
  .shop-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 8px 10px;
  }
  .shop-thumb { width: 40px; height: 40px; flex: none; }
  .shop-thumb.ticket-thumb {
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: rgba(255,255,255,.1); border: 2px dashed rgba(255,255,255,.3);
  }
  .shop-info { flex: 1; min-width: 0; }
  .shop-name { font-size: 13px; font-weight: 700; }
  .shop-desc { font-size: 11px; opacity: .75; line-height: 1.5; margin-top: 2px; }
  .buybtn {
    flex: none; font-size: 12px; padding: 8px 12px; border-radius: 10px;
    box-shadow: none; background: linear-gradient(180deg, #7fdcff, var(--sky));
  }
  .buybtn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .owned-tag { flex: none; font-size: 11px; opacity: .6; font-weight: 700; }

  .shop-sec { font-size: 12px; font-weight: 800; letter-spacing: .08em; opacity: .7; margin: 6px 2px -2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 11.5px; padding: 7px 10px; border-radius: 999px; letter-spacing: 0;
    color: var(--paper); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); box-shadow: none;
  }
  .chip.on { background: #fff; color: #04121f; border-color: #fff; }
  .chip.buy { background: linear-gradient(180deg, #7fdcff, var(--sky)); color: #04121f; border: 0; }
  .chip.sure { background: linear-gradient(180deg, #ffe27a, #ffb14d); }
  .chip:disabled { opacity: .35; }

  .shop-row.off { opacity: .55; }
  .ver { margin-top: 8px; font-size: 10px; opacity: .45; letter-spacing: .05em; }
  .oCoin { color: var(--lime); font-size: 13px; font-weight: 700; min-height: 1.2em; margin: -8px 0 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <img id="spaceimg" class="spimg" alt="" aria-hidden="true">
    <img id="space2img" class="spimg" alt="" aria-hidden="true">
    <img id="bgimg" alt="" aria-hidden="true">
    <canvas id="cv"></canvas>
    <button id="bPause" class="pausebtn" aria-label="一時停止">❚❚</button>

    <div class="hud">
      <div><span class="h-num" id="hM">0</span><span class="h-unit">m</span></div>
      <div class="h-best">ベスト <span id="hBest">0</span>m</div>
    </div>

    <div class="veil on" id="vStart">
      <div class="tart">
        <div class="tcoin"><span class="coin-ico">★</span><span id="coinCount">0</span></div>
        <button class="gear" id="bMenu" aria-label="メニュー"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M10.3 1.5h3.4l.5 2.7a8 8 0 0 1 2 1.2l2.6-.9 1.7 2.9-2.1 1.8a8 8 0 0 1 0 2.4l2.1 1.8-1.7 2.9-2.6-.9a8 8 0 0 1-2 1.2l-.5 2.7h-3.4l-.5-2.7a8 8 0 0 1-2-1.2l-2.6.9-1.7-2.9 2.1-1.8a8 8 0 0 1 0-2.4L3.5 7.4l1.7-2.9 2.6.9a8 8 0 0 1 2-1.2zM12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2z"/></svg></button>
        <button class="hot" id="bStart" aria-label="スタート">スタート</button>
        <button class="hot" id="bChars" aria-label="キャラ選択">キャラ選択</button>
        <button class="hot" id="bShop" aria-label="ショップ">ショップ</button>
        <div class="item-toggles" id="itemToggles"></div>
        <div class="ver" id="ver">版 2026-09-24m</div>
      </div>
    </div>

    <div class="veil" id="vChars">
      <div class="tcard">
        <h2>キャラ選択</h2>
        <div class="picker" id="picker"></div>
        <button id="bCharsOk">けってい</button>
      </div>
    </div>

    <div class="veil" id="vMenu">
      <div class="card">
        <h2>メニュー</h2>
        <div class="menu-list">
          <button class="ghost" id="bTitles">🏅 称号 <span id="titleName">称号なし</span><span class="tcount" id="titleCount"></span></button>
        </div>
        <div class="menu-list">
          <button class="ghost" id="bMusic"></button>
          <button class="ghost" id="bSfx"></button>
        </div>
        <button class="ghost" id="bMenuClose">とじる</button>
      </div>
    </div>

    <div class="veil" id="vOver">
      <div class="card">
        <h2>落下</h2>
        <div class="big"><span id="oM">0</span><span style="font-size:18px">m</span></div>
        <div class="oCoin" id="oCoin"></div>
        <div class="note" id="oNote"></div>
        <button id="bRetry">もう一度</button>
        <div><button class="ghost" id="bChange">キャラを変える</button></div>
      </div>
    </div>

    <div class="veil" id="vPause">
      <div class="card">
        <h2>一時停止</h2>
        <p>すこし休んでから、また跳ぼう。</p>
        <button id="bResume">つづける</button>
        <div><button class="ghost" id="bQuit">タイトルへ</button></div>
      </div>
    </div>

    <div class="veil" id="vTitles">
      <div class="card shop-card">
        <h2>称号</h2>
        <div class="shop-list" id="titleList"></div>
        <button class="ghost" id="bTitlesClose">とじる</button>
      </div>
    </div>

    <div class="veil" id="vShop">
      <div class="card shop-card">
        <h2>ショップ</h2>
        <div class="coin-pill big-pill">🪙 <span id="shopCoinCount">0</span></div>
        <div class="shop-list" id="shopList"></div>
        <button class="ghost" id="bShopClose">とじる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== 調整値 =====
  var G = 0.35;            // ふわっと長め
  var LOWG = 0.18;         // 宇宙の低重力
  var JUMP = -9.5;         // 到達高 ≒ 129px（低重力なら約251px）
  var TRAMPO_F = -13.6;
  var BOOST_F = -20.5;
  var SPEED = 5.0;
  var PXM = 10;
  var SAFE_GAP = 104;      // 消えない足場どうしの最大間隔（129px未満）
  var SAFE_GAP_LOW = 205;  // 低重力ゾーンでの最大間隔（251px未満）
  var GOAL_M = 2000;       // 宇宙ステーション
  var PW = 0.17;
  var PH = 11;

  var BEAM = 0, GONDOLA = 1, TRAMPO = 2, BOOST = 3,
      GLASS = 4, CLOUD = 5, HOLO = 6, STATION = 7,
      CONVEYOR = 8, CRUMBLE = 9, MILE = 10, UPDRAFT = 11;
  var UPDRAFT_H = 170;      // 上昇気流の柱の高さ(下端が p.y)

  var SKY = [
    // 背景の絵の色に合わせる(絵が読めないとき・絵を薄くしたあとに見える)。2000m から先は暗い宇宙へ
    { m: 0,    t: [60, 146, 240], b: [180, 210, 240] },
    { m: 1500, t: [40, 90, 200],  b: [100, 180, 250] },
    { m: 2000, t: [31, 59, 144],  b: [37, 62, 160] },
    { m: 2350, t: [24, 42, 116],  b: [30, 48, 132] },
    { m: 2800, t: [6, 8, 30],     b: [16, 18, 58] },
    { m: 5000, t: [10, 4, 32],    b: [34, 14, 70] },
    { m: 10000, t: [2, 12, 30],   b: [10, 46, 72] },
    { m: 20000, t: [16, 2, 26],   b: [58, 12, 64] }
  ];

  // 性能は「ジャンプ 8.9 以上」を守る（それ未満だと届かない足場が出る）
  var CHARS = [
    { key: 'usagi', n: 'バネうさぎ', tag: 'ジャンプ特化',

      if (sk) { for (var id in stock) stock[id] = sk[id] | 0; }
      else stock.ticket = parseInt(localStorage.getItem('skyHopTickets') || '0', 10) || 0;
      var eq = JSON.parse(localStorage.getItem('skyJumpEquip') || 'null');
      if (eq) { equip.skin = eq.skin || {}; equip.trail = eq.trail || 'none'; }
      owned = JSON.parse(localStorage.getItem('skyHopOwned') || '{}') || {};
      for (var u = 0; u < CHARS.length; u++) if (CHARS[u].unlockM && best >= CHARS[u].unlockM) owned[CHARS[u].key] = true;
      var i = findChar(localStorage.getItem('skyJumpChar'));
      if (i >= 0 && !isLocked(CHARS[i])) sel = i;
      titles = JSON.parse(localStorage.getItem('skyJumpTitles') || '{}') || {};
    } catch (e) {
      best = 0; coins = 0; owned = {}; titles = {};
      stock = { ticket: 0, rocket: 0, rescue: 0 }; equip = { skin: {}, trail: 'none' };
    }
    // 称号ができる前に届いていた高さのぶんは、ベストの記録から渡す(キャラ別は記録が無いので渡せない)
    for (var k = 0; k < TITLES.length; k++) {
      if (!TITLES[k].ch && best >= TITLES[k].m) titles[TITLES[k].id] = true;
    }
    saveTitles();
    elBest.textContent = best;
  }
  function saveBest() {
    if (score <= best) return;
    best = score; elBest.textContent = best;
    try { localStorage.setItem('skyHopBest', String(best)); } catch (e) {}
  }

  // 写真1枚で届いた版と高さが分かるよう、版の横に「描ける / 渡された / vh」を出す
  var VERSION = '版 2026-09-26a';
  function vhPx() {
    var b = document.createElement('div');
    b.style.cssText = 'position:absolute;left:0;top:0;width:0;height:100vh;visibility:hidden;';
    document.body.appendChild(b);
    var h = Math.round(b.getBoundingClientRect().height);
    b.remove();
    return h;
  }
  function renderDiag() {
    $('ver').textContent = VERSION + '・描ける' + Math.round(H) + ' / 窓' + window.innerHeight + ' / vh' + vhPx();
  }
  function fit() {
    cv = $('cv');
    ctx = cv.getContext('2d');
    var r = cv.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  }

  // ===== 背景 =====
  // 動かない背景は一度だけ別キャンバスに描いて、毎フレームは貼るだけにする
  function sprite(w, h, fn) {
    var c = document.createElement('canvas');
    c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
    var g = c.getContext('2d');
    g.scale(dpr, dpr);
    fn(g);
    return c;
  }
  function initBg() {
    stars = [];
    for (var i = 0; i < 95; i++) stars.push({ x: rnd(0, W), y: rnd(0, H * 3), r: rnd(.4, 1.6), a: rnd(.3, 1) });
    buildSpace();
  }

  function skyPair() {
    var a = SKY[0], b = SKY[0];
    for (var i = 0; i < SKY.length; i++) {
      if (SKY[i].m <= hm) { a = SKY[i]; b = SKY[i]; }
      if (SKY[i].m > hm) { b = SKY[i]; break; }
    }
    var t = b.m === a.m ? 0 : (hm - a.m) / (b.m - a.m);
    function mix(c1, c2) {
      return 'rgb(' + Math.round(c1[0] + (c2[0] - c1[0]) * t) + ',' +
                      Math.round(c1[1] + (c2[1] - c1[1]) * t) + ',' +
                      Math.round(c1[2] + (c2[2] - c1[2]) * t) + ')';
    }
    return [mix(a.t, b.t), mix(a.b, b.b)];
  }

  // 全画面のグラデーションを毎フレーム塗ると遅い端末で倍重くなるので、CSS の背景に任せる。
  // 色は #board に敷く(その上に背景の絵、いちばん上に透明な canvas が重なる)
  var skyCss = '';
  function drawSky() {
    var c = skyPair();
    var css = 'linear-gradient(' + c[0] + ',' + c[1] + ')';
    if (css !== skyCss) { skyCss = css; $('board').style.background = css; }
  }

  // ステージの背景の絵: 0m で絵の下端(朝日と雲海)、BG_TOP_M で上端(宇宙)が見えるよう、登るにつれて流す。
  // それより上では、同じ速さで下へ流しながら 400m で薄くして、奥の宇宙の絵へつなぐ
  var BG_SCALE = 1.5, BG_TOP_M = 2000, BG_FADE_M = 400, bgKey = '';
  var bgEl = $('bgimg');
  bgEl.src = 'stage-bg.jpg';
  function drawBg() {
    if (!bgEl.naturalWidth) return;
    var bh = W * bgEl.naturalHeight / bgEl.naturalWidth * BG_SCALE, travel = bh - H;
    var y = -travel * (1 - Math.min(hm, BG_TOP_M) / BG_TOP_M) + Math.max(0, hm - BG_TOP_M) * travel / BG_TOP_M;
    var a = Math.max(0, 1 - Math.max(0, hm - BG_TOP_M) / BG_FADE_M);
    var key = y.toFixed(1) + ':' + a.toFixed(2);
    if (key === bgKey) return;
    bgKey = key;
    bgEl.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0) scale(' + BG_SCALE + ')';
    bgEl.style.opacity = a.toFixed(2);
  }
  function hideBg() {
    bgKey = ''; bgEl.style.opacity = '0';
    SPACES.forEach(function (L) { L.key = ''; L.el.style.opacity = '0'; });
  }

  // 宇宙の絵: 縦を画面の 1.1倍にそろえ(左右は少し切れる)、受け持つ高さのあいだに下端から上端へごくゆっくり流す。
  // 遠いので動きは小さくし、登っている感じは手前の星と流れ星で出す。
  // 2枚目(明るい宇宙)は星の港(10000m)に近づくと手前に重なり、重なり切ったら奥の1枚目は隠す
  var SP_SCALE = 1.1;
  var SPACES = [
    { el: $('spaceimg'), src: 'space-bg.jpg', from: BG_TOP_M, to: 10000, fadeIn: null, key: '' },
    { el: $('space2img'), src: 'space2-bg.jpg', from: 10000, to: 40000, fadeIn: [9600, 10000], key: '' }
  ];
  SPACES.forEach(function (L) { L.el.src = L.src; });
  function spaceLayerAlpha(k) {
    var L = SPACES[k];
    if (hm <= BG_TOP_M - 200) return 0;
    var a = L.fadeIn ? Math.max(0, Math.min(1, (hm - L.fadeIn[0]) / (L.fadeIn[1] - L.fadeIn[0]))) : 1;
    // 手前の絵が重なり切っていたら、奥は隠す(重ねたまま合成しない)
    if (k + 1 < SPACES.length && spaceLayerAlpha(k + 1) >= 1) a = 0;
    return a;
  }
  function drawSpaceBg() {
    for (var k = 0; k < SPACES.length; k++) {
      var L = SPACES[k], el = L.el;
      if (!el.naturalWidth) continue;
      var a = spaceLayerAlpha(k);
      var sh = H * SP_SCALE, sw = sh * el.naturalWidth / el.naturalHeight;
      var p = Math.max(0, Math.min(1, (hm - L.from) / (L.to - L.from)));
      var x = (W - sw) / 2, y = -(sh - H) * (1 - p);
      var key = a > 0 ? x.toFixed(1) + ':' + y.toFixed(1) + ':' + a.toFixed(2) : 'off';
      if (key === L.key) continue;
      L.key = key;
      el.style.opacity = a.toFixed(2);
      el.style.width = sw.toFixed(1) + 'px';
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    }
  }


  // ===== 宇宙 =====
  // 星雲・惑星・地球は宇宙の絵(space-bg.jpg)に描いてある。ここでは手前で動く星と流れ星だけ持つ
  var bigStars = [], shoots = [], shootT = 200;
  function buildSpace() {
    bigStars = [];
    for (var i = 0; i < 26; i++) bigStars.push({ x: rnd(0, W), y: rnd(0, H * 3), r: rnd(1, 2.2), ph: rnd(0, 6.28) });
    shoots = [];
  }
  function spaceAlpha() { return Math.max(0, Math.min(1, (hm - BG_TOP_M) / 600)); }
  // 流れ星(宇宙に入ってから、ときどき)
  function stepSpace() {
    if (hm > BG_TOP_M + 100 && --shootT <= 0) {
      shoots.push({ x: rnd(W * .3, W + 40), y: rnd(0, H * .45), vx: -rnd(7, 10), vy: rnd(2.5, 4), life: 1 });
      shootT = rnd(180, 420);
    }
    for (var i = shoots.length - 1; i >= 0; i--) {
      var s = shoots[i];
      s.x += s.vx; s.y += s.vy; s.life -= .018;
      if (s.life <= 0) shoots.splice(i, 1);
    }
  }
  function wrapY(y, span) { return ((y % span) + span) % span; }
  function drawSpace() {
    var a = spaceAlpha();
    if (a <= 0) return;
    var i;
    for (i = 0; i < bigStars.length; i++) {
      var b = bigStars[i], by = wrapY(b.y - camY * .3, H * 3) - H;
      if (by < -8 || by > H + 8) continue;
      ctx.globalAlpha = a;
      twinkle(ctx, b.x, by, b.r, .45 + .55 * Math.abs(Math.sin(frame * .04 + b.ph)));
    }
    ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
    for (i = 0; i < shoots.length; i++) {
      var s = shoots[i];
      var gr = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 8, s.y - s.vy * 8);
      gr.addColorStop(0, 'rgba(255,255,255,' + (s.life * a) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.strokeStyle = gr; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 8, s.y - s.vy * 8); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawStars() {
    var a = Math.max(0, Math.min(1, (hm - BG_TOP_M + 100) / 400));
    if (a <= 0) return;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var y = ((s.y - camY * .22) % (H * 3) + H * 3) % (H * 3) - H;
      if (y < -4 || y > H + 4) continue;
      var tw = .8 + .2 * Math.sin(frame * .05 + i);
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,' + (s.a * a * tw) + ')'; ctx.fill();
    }
  }

  // 近づいてくる宇宙ステーション
  function drawStationFar() {
    if (goalGot || hm < 1150 || hm >= GOAL_M) return;
    var p = Math.min(1, (hm - 1150) / 850);
    var s = .35 + p * 1.5;
    var x = W * .7, y = 84 + p * 16;
    ctx.save();
    ctx.globalAlpha = hm > 1940 ? Math.max(0, 1 - (hm - 1940) / 60) : .95;
    ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(frame * .004) * .12);
    if (facImg.naturalWidth) {
      var fa = FAC_ART.far, fw = 96, fh = fw * fa[3] / fa[2];
      ctx.drawImage(facImg, fa[0], fa[1], fa[2], fa[3], -fw / 2, -fh / 2, fw, fh);
      ctx.restore();
      return;
    }
    ctx.fillStyle = '#20406e';
    ctx.fillRect(-40, -3, 80, 6);
    ctx.fillStyle = '#c8d6e6';
    ctx.fillRect(-13, -9, 26, 18);
    ctx.fillStyle = '#7fb2ff';
    ctx.fillRect(-40, -11, 22, 22);
    ctx.fillRect(18, -11, 22, 22);
    ctx.strokeStyle = 'rgba(20,40,80,.6)'; ctx.lineWidth = 1;
    for (var i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(-29 + i * 0, -11); ctx.lineTo(-29, 11); ctx.stroke();
    }
    ctx.restore();
  }

  // 出発地点の地面: 草の生えた浮き島のふち(絵が読めるまでは図形で描く)
  function drawGround() {
    var gy = groundY - camY;
    if (gy > H + 40) return;
    if (drawFacility('ground', gy) >= 0) return;
    ctx.save();
    var gr = ctx.createLinearGradient(0, gy, 0, gy + 30);
    gr.addColorStop(0, '#b9a58c'); gr.addColorStop(1, '#8a7a88');
    ctx.fillStyle = gr; ctx.fillRect(0, gy + 6, W, 30);
    ctx.strokeStyle = 'rgba(70,55,60,.28)'; ctx.lineWidth = 1;
    for (var k = 0; k < 3; k++) {
      var yy = gy + 12 + k * 9;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
      for (var x = (k % 2) * 14; x < W; x += 28) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x, yy + 9); ctx.stroke(); }
    }
    var gg = ctx.createLinearGradient(0, gy - 4, 0, gy + 10);
    gg.addColorStop(0, '#9ae05a'); gg.addColorStop(1, '#4c9e3a');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.moveTo(0, gy - 2);
    for (var i = 0; i <= 24; i++) ctx.quadraticCurveTo(W * (i - .5) / 24, gy + (i % 2 ? 12 : 9), W * i / 24, gy + 7);
    ctx.lineTo(W, gy - 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2f5a2a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, gy - 1.5); ctx.lineTo(W, gy - 1.5); ctx.stroke();
    ctx.restore();
  }

  // ===== 足場 =====
  function mk(x, y, type, w) {
    return { x: x, y: y, w: Math.max(44, w), h: PH, type: type,
             dead: false, crack: false, dip: 0,
             ph: rnd(0, 6.28), dir: Math.random() < .5 ? 1 : -1, sp: rnd(.9, 2.3),
             fallT: 0, fv: 0 };
  }

  function spineType(m) {
    if (ticketActive && m >= 90) {
      var rb = Math.random();
      if (m >= 450 && rb < .22) return Math.random() < .5 ? TRAMPO : BOOST;
      if (m < 450 && rb < .16) return TRAMPO;
    }
    var r = Math.random();
    if (m < 90) return BEAM;
    if (m < 450) { if (r < .13) return GONDOLA; if (r < .23) return TRAMPO; if (r < .31) return CONVEYOR; return BEAM; }
    if (m < 1100) { if (r < .20) return GONDOLA; if (r < .31) return TRAMPO; if (r < .35) return BOOST; if (r < .45) return CONVEYOR; return BEAM; }
    if (r < .26) return GONDOLA;
    if (r < .37) return TRAMPO;
    if (r < .43) return BOOST;
    if (r < .55) return CONVEYOR;
    return BEAM;
  }
  function bonusType(m) {
    var r = Math.random();
    if (m < 300) return r < .35 ? CRUMBLE : GLASS;
    if (m < 900) { if (r < .34) return CLOUD; if (r < .6) return GLASS; return CRUMBLE; }
    if (r < .3) return HOLO;
    if (r < .52) return GLASS;
    if (r < .76) return CRUMBLE;
    return CLOUD;
  }
  function gap(m, y) {
    var d = Math.min(m / 1800, 1);
    var raw = (H / 8) * (.55 + Math.random() * .8) * (1 + d * .35);
    if (y < goalY) return Math.min(raw * 1.9, SAFE_GAP_LOW);
    return Math.min(raw, SAFE_GAP);
  }
  function wmul(m, t) {
    var lo, hi;
    if (m < 400) { lo = 1.0; hi = 1.5; }
    else if (m < 1200) { lo = .85; hi = 1.3; }
    else { lo = .72; hi = 1.15; }
    var v = lo + Math.random() * (hi - lo);
    if (t === TRAMPO || t === BOOST) v = Math.max(v, .95);
    return v;
  }

  // 横幅 w の足場を、ほかの足場と横に重ならない位置に置く。絵は判定より左右に幅の2割ほどはみ出すので、
  // そのぶんと隙間 8pt を空ける。何度か試して見つからなければ null。fixedX を渡すと、その位置で重ならないかだけ見る。
  // 左右に動く足場が近くにあるときは、どこに置いてもいつか重なるので null
  var recentSpine = [], recentBonus = [], afterMile = false;   // 近くの道すじと、近くのおまけ
  function freeX(w, others, fixedX) {
    for (var tries = 0; tries < (fixedX === undefined ? 12 : 1); tries++) {
      var x = fixedX === undefined ? rnd(0, W - w) : fixedX, ok = true;
      for (var i = 0; i < others.length; i++) {
        var o = others[i];
        if (!o || o.w >= W - 1) continue;
        if (o.type === GONDOLA) return null;   // 左右に動く足場は端から端まで往復するので、近くには置けない
        if (x - w * .2 < o.x + o.w * 1.2 + 8 && o.x - o.w * .2 < x + w * 1.2 + 8) { ok = false; break; }
      }
      if (ok) return x;
    }
    return null;
  }
  function fillUpTo(topY) {
    var base = W * PW;
    while (genY > topY) {
      // 区切りのブロックは、直前の足場から届く間隔に置く
      if (genY - mileY <= (genY < goalY ? SAFE_GAP_LOW : SAFE_GAP)) {
        var st = mk(0, mileY, mileIdx === 0 ? STATION : MILE, W);
        st.h = 18; st.mi = mileIdx; plats.push(st);
        afterMile = true;   // 区切りのすぐ上には、おまけを置かない(絵が区切りの上面に触れる)
        genY = mileY;
        mileIdx++; mileY = mToY(mileAt(mileIdx));
        continue;
      }
      var g = gap(yToM(genY), genY);
      var ny = genY - g;
      if (ny < mileY + 80) ny = mileY + 80;

      var m = yToM(ny), L = zoneLv(m), thin = 1 - .07 * L;
      var t = spineType(m);
      var w = base * wmul(m, t) * thin;
      var sp = mk(rnd(0, W - w), ny, t, w);
      sp.sp *= 1 + .15 * L;
      plats.push(sp);
      // 道すじは届く間隔の保証があるので動かさない。先に置いたおまけと重なったら、おまけの方を取り除く
      for (var bi = recentBonus.length - 1; bi >= 0; bi--) {
        var ob = recentBonus[bi];
        if (Math.abs(ob.y - sp.y) < 140 && freeX(ob.w, [sp], ob.x) === null) {
          var at = plats.indexOf(ob);
          if (at >= 0) plats.splice(at, 1);
          recentBonus.splice(bi, 1);
        }
      }

      // おまけの足場は、上下の道すじの足場と横に重ならない所にだけ置く(置けなければ置かない)。
      // 雲が道すじの真上に重なると、降りてきたところで雲に乗って低くしか跳べず、次へ届かなくなった
      // 置く確率は、重なって取りやめるぶんを見込んで少し高めにし、おまけの数を前(重なりを許していた頃)とそろえた
      if (!afterMile && g > 54 && Math.random() < (m < 300 ? .5 : 1)) {
        var bt = m >= 300 && Math.random() < .2 ? UPDRAFT : bonusType(m);
        // 幅は mk() と同じく 44pt 未満にはしない(細いまま位置を決めると、広げたぶん重なった)
        var bw = Math.max(44, bt === UPDRAFT ? 56 : base * wmul(m, bt) * .88 * thin);
        var bx = freeX(bw, recentSpine.concat([sp]));
        if (bx !== null) {
          var bp = mk(bx, ny + g * (.35 + Math.random() * .3), bt, bw);
          bp.bonus = true;
          plats.push(bp);
          recentBonus.push(bp);
        }
      }
      recentSpine.push(sp);
      // 近くの物は個数ではなく上下の距離(200pt 以内)で覚える。個数で切ると、おまけが続いたときに漏れた
      recentSpine = recentSpine.filter(function (o) { return o.y - sp.y < 200; });
      recentBonus = recentBonus.filter(function (o) { return o.y - sp.y < 200; });
      afterMile = false;
      genY = ny;
    }
  }

  // 5000m 月面基地 / 10000m 星の港 / 20000m〜 銀河ゲート
  function drawMile(p, y) {
    var th = Math.min(p.mi, 3);
    var C = [null,
      { base: '#c9ccd6', top: '#eef0f5', mark: '#a3a8b8' },
      { base: '#26306e', top: '#ffd84a', mark: '#ffe89a' },
      { base: '#4b2f8f', top: '#c9a6ff', mark: '#e6d6ff' }][th];
    ctx.save();
    // 絵があれば絵で描き、名前は前の面の真ん中あたりに書く
    var hb = drawFacility(['moon', 'port', 'gate'][th - 1], y), i;
    if (hb >= 0) {
      /* 絵で描いた */
    } else {
    ctx.fillStyle = C.base; ctx.fillRect(0, y, W, p.h + 70);
    ctx.fillStyle = C.top; ctx.fillRect(0, y, W, 5);
    if (th === 1) {
      ctx.fillStyle = C.mark;
      for (i = 0; i < 7; i++) {
        ctx.beginPath(); ctx.ellipse((i * 83) % (W - 30) + 15, y + 22 + (i % 3) * 14, 9 - (i % 3) * 2, 4, 0, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = 'rgba(180,220,255,.55)';
      ctx.beginPath(); ctx.arc(W * .8, y, 22, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#eef0f5'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W * .16, y); ctx.lineTo(W * .16, y - 30); ctx.stroke();
      ctx.fillStyle = '#e8403f'; ctx.fillRect(W * .16, y - 30, 16, 10);
    } else if (th === 2) {
      for (i = 0; i * 26 < W; i++) {
        var on = (frame + i * 7) % 40 < 20;
        ctx.fillStyle = on ? C.mark : 'rgba(255,232,154,.3)';

      life: .9, r: rnd(2.2, 3.4), sh: kind, rot: rnd(0, 6.28),
      c: kind === 'rainbow' ? 'hsl(' + ((frame * 6) % 360) + ',95%,65%)'
        : kind === 'heart' ? '#ff6b8a' : kind === 'sakura' ? '#ffb7cc' : '#fff6b0' });
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], y = p.y - camY;
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.sh === 'star') { twinkle(ctx, p.x, y, p.r * .7, 1); continue; }
      ctx.fillStyle = p.c;
      if (p.sh === 'heart') heartPath(ctx, p.x, y, p.r);
      else if (p.sh === 'sakura') ell(ctx, p.x, y, p.r, p.r * .55, p.rot + p.life * 3);
      else { ctx.beginPath(); ctx.arc(p.x, y, p.r, 0, 6.2832); }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ===== じゃまもの =====
  function knock(dx, down) {
    if (invuln > 0 || rocketOn) return;
    Snd.sfx('hit');
    if (CH.tough) {
      invuln = 45;
      pl.kx = dx * 1.1;
      burst(pl.x + pl.w / 2, pl.y + pl.h / 2, '#ffffff', 10);
      return;
    }
    invuln = 85;
    pl.vy = Math.max(pl.vy, down || 2.6);
    pl.kx = dx * 3.6;
    burst(pl.x + pl.w / 2, pl.y + pl.h / 2, '#dbe6f2', 8);
  }
  function countFoe(k) {
    var n = 0;
    for (var i = 0; i < foes.length; i++) if (foes[i].k === k) n++;
    return n;
  }
  function stepFoes() {
    if (cheer <= 0) {
      if (hm > 240 && hm < 1500 && --droneT <= 0) {
        if (countFoe('drone') < 2) {
          var d = Math.random() < .5 ? 1 : -1;
          foes.push({ k: 'drone', st: 'warn', t: 55, dir: d, x: d > 0 ? -34 : W + 34,
                      oy: H * rnd(.12, .5), y: 0, vx: d * rnd(2.1, 3.3), bob: rnd(0, 6.28) });
        }
        droneT = rnd(200, 420);
      }
      if (hm > 950 && --debrisT <= 0) {
        if (countFoe('debris') < Math.min(3 + lv, 6)) {
          var y0 = camY - 50, x0 = rnd(0, W), vy = rnd(5.5, 8);
          var tx2 = pl.x + pl.w / 2 + rnd(-90, 90);
          var fr = Math.max((pl.y - y0) / vy, 1);
          foes.push({ k: 'debris', st: 'warn', t: 62, x: x0, oy: -50, y: y0,
                      vx: Math.max(-4.5, Math.min(4.5, (tx2 - x0) / fr)), vy: vy,
                      rot: rnd(0, 6.28), rv: rnd(-.12, .12) });
        }
        debrisT = rnd(170, 330) / (1 + .25 * lv);
      }
    }
    for (var i = foes.length - 1; i >= 0; i--) {
      var f = foes[i];
      if (f.st === 'warn') {
        f.y = camY + f.oy;
        if (--f.t <= 0) f.st = 'go';
        continue;
      }
      if (f.k === 'drone') {
        f.x += f.vx; f.bob += .2;
        var my = f.y + Math.sin(f.bob) * 10;
        if (invuln <= 0 && pl.x + pl.w > f.x - 15 && pl.x < f.x + 15 &&
            pl.y + pl.h > my - 10 && pl.y < my + 10) knock(f.dir);
        if (f.x > W + 60 || f.x < -60) foes.splice(i, 1);
      } else {
        f.x += f.vx; f.y += f.vy; f.rot += f.rv;
        if (frame % 2 === 0) {
          parts.push({ x: f.x - f.vx, y: f.y - f.vy, vx: rnd(-.8, .8), vy: rnd(-.8, .8),
                       life: .5, c: Math.random() < .5 ? '#ff9a3d' : '#ffe08a', r: rnd(1, 3) });
        }
        var dx = f.x - (pl.x + pl.w / 2), dy = f.y - (pl.y + pl.h / 2);
        if (invuln <= 0 && dx * dx + dy * dy < 24 * 24) knock(f.vx >= 0 ? 1 : -1);
        if (f.y > camY + H + 70) foes.splice(i, 1);
      }
    }
  }
  function edgeWarn(dir, sy) {
    var x = dir > 0 ? 15 : W - 15;
    var y = Math.max(26, Math.min(H - 14, sy));
    ctx.save();
    ctx.globalAlpha = .35 + .6 * Math.abs(Math.sin(frame * .2));
    ctx.fillStyle = '#ff5a5a'; ctx.font = '800 18px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y);
    ctx.restore();
  }
  function drawFoes() {
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      if (f.k === 'drone') {
        if (f.st === 'warn') { edgeWarn(f.dir, f.y - camY); continue; }
        var y = f.y + Math.sin(f.bob) * 10 - camY;
        if (y < -30 || y > H + 30) continue;
        ctx.save();
        // アーム
        ctx.strokeStyle = '#3c465a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(f.x - 11, y - 4); ctx.lineTo(f.x + 11, y + 2);
        ctx.moveTo(f.x + 11, y - 4); ctx.lineTo(f.x - 11, y + 2);
        ctx.stroke();
        // ローター
        ctx.strokeStyle = 'rgba(200,220,240,.55)'; ctx.lineWidth = 1.5;
        var spin = (frame % 6 < 3) ? 8 : 4;
        for (var q = 0; q < 4; q++) {
          var rx = f.x + (q % 2 ? 11 : -11), ry = y + (q < 2 ? -4 : 2);
          ctx.beginPath(); ctx.ellipse(rx, ry, spin, 2, 0, 0, 6.2832); ctx.stroke();
        }
        // 本体
        ctx.fillStyle = '#2b3446';
        rr(f.x - 9, y - 4, 18, 9, 3); ctx.fill();
        ctx.fillStyle = (frame % 40 < 20) ? '#ff5a5a' : '#3dd6f5';
        ctx.beginPath(); ctx.arc(f.x + f.dir * 6, y, 2, 0, 6.2832); ctx.fill();
        // カメラ
        ctx.fillStyle = '#4a5468';
        ctx.beginPath(); ctx.arc(f.x, y + 6, 3.5, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else {
        var ey = f.y - camY;
        if (f.st === 'warn') {
          var len = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
          ctx.save();
          ctx.globalAlpha = .25 + .45 * Math.abs(Math.sin(frame * .15));
          ctx.strokeStyle = '#ff7a4d'; ctx.lineWidth = 2; ctx.setLineDash([5, 8]);
          ctx.beginPath(); ctx.moveTo(f.x, ey);
          ctx.lineTo(f.x + (f.vx / len) * H * 1.6, ey + (f.vy / len) * H * 1.6);
          ctx.stroke(); ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(f.x, Math.max(ey, 14), 6, 0, 6.2832);
          ctx.fillStyle = '#ff7a4d'; ctx.fill();
          ctx.restore();
          continue;
        }
        if (ey < -40 || ey > H + 40) continue;
        ctx.save();
        ctx.translate(f.x, ey); ctx.rotate(f.rot);
        ctx.fillStyle = '#7a8496';
        ctx.beginPath();
        for (var v = 0; v < 7; v++) {
          var a = (6.2832 / 7) * v, rr3 = 11 * (.75 + ((v * 37) % 10) / 28);
          if (v === 0) ctx.moveTo(Math.cos(a) * rr3, Math.sin(a) * rr3);
          else ctx.lineTo(Math.cos(a) * rr3, Math.sin(a) * rr3);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5a6476';
        ctx.beginPath(); ctx.arc(-3, -2, 3, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    }
  }

  // ===== ビル風 =====
  function stepWind() {
    if (hm < 200) { wind = 0; windTo = 0; return; }
    if (--windT <= 0) {
      if (Math.abs(windTo) > .05) { windTo = 0; windT = rnd(240, 460); }
      else { windTo = (Math.random() < .5 ? -1 : 1) * rnd(.5, 1.05) * (1 + .1 * lv); windT = rnd(220, 380); }
    }
    wind += (windTo - wind) * .02;
  }
  function drawWind() {
    if (Math.abs(wind) < .12) return;
    var n = Math.min(1, Math.abs(wind) / 1.05);
    ctx.save();
    ctx.globalAlpha = .25 + n * .35;
    ctx.strokeStyle = '#dceaff'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    for (var i = 0; i < 5; i++) {
      var y = 46 + i * 9;
      var off = ((frame * wind * 2.4) % (W + 90)) - 45;
      var len = 16 + i * 6 * n;
      var x = ((off + i * 57) % (W + 90) + (W + 90)) % (W + 90) - 45;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * (wind < 0 ? -1 : 1), y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCheer() {
    if (cheer <= 0) return;
    var a = Math.min(1, cheer / 30, (200 - cheer) / 20);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#fff';
    ctx.font = '800 24px system-ui, sans-serif';
    var L = zoneLv(mileAt(cheerMi));
    ctx.fillText(cheerMi === 0 ? 'ドッキング成功' : mileAt(cheerMi) + 'm 到達！', W / 2, H * .27);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText(cheerMi === 0 ? 'ここから低重力ゾーン'
      : mileName(cheerMi) + '・ここから むずかしさ Lv' + L + (L >= MAX_LV ? '(最大)' : ''), W / 2, H * .27 + 24);
    ctx.restore();
  }

  function drawToast() {
    if (toastT <= 0) return;
    var a = Math.min(1, toastT / 20, (150 - toastT) / 15);
    var txt = toastText;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = '800 15px system-ui, sans-serif';
    var tw = ctx.measureText(txt).width + 28, y = H * .17;
    ctx.fillStyle = 'rgba(10,14,40,.7)';
    rr(W / 2 - tw / 2, y - 18, tw, 34, 17); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.textAlign = 'center';
    ctx.fillText(txt, W / 2, y + 5);
    ctx.restore();
  }

  // ===== ループ =====
  function step() {
    if (invuln > 0) invuln--;
    if (cheer > 0) {
      cheer--;
      if (cheer > 50 && cheer % 26 === 0) confetti(W / 2, camY + 70);
    }
    hm = Math.max(0, yToM(pl.y));
    lv = zoneLv(hm);
    if (toastT > 0) toastT--;
    else if (toastQ.length) { toastText = toastQ.shift(); toastT = 150; }
    stepWind();

    var mv = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) mv = -CH.speed;
    if (keys['ArrowRight'] || keys['KeyD']) mv = CH.speed;
    if (touchX !== null) {
      var c = pl.x + pl.w / 2;
      if (touchX < c - 8) mv = -CH.speed;
      else if (touchX > c + 8) mv = CH.speed;
    }
    if (mv) pl.face = mv > 0 ? 1 : -1;
    pl.x += mv + wind * 1.9 * CH.wind;

    if (pl.kx !== 0) {
      pl.x += pl.kx; pl.kx *= .88;
      if (Math.abs(pl.kx) < .1) pl.kx = 0;
    }
    if (pl.x + pl.w < 0) pl.x = W;
    if (pl.x > W) pl.x = -pl.w;

    pl.vy += (pl.y < goalY ? LOWG : G) * CH.grav;
    var inUd = null;
    for (var u = 0; u < plats.length; u++) {
      var ud = plats[u];
      if (ud.type !== UPDRAFT) continue;
      var pcx = pl.x + pl.w / 2, pb = pl.y + pl.h;
      if (pcx > ud.x && pcx < ud.x + ud.w && pb < ud.y + 6 && pb > ud.y - UPDRAFT_H) {
        inUd = ud;
        if (pl.inUd !== ud) Snd.sfx('updraft');   // 風の音は、柱に入った瞬間だけ
        // 速く落ちてきても柱の中で止まれる強さ(速さ10なら約77pxで上向きに変わる)
        pl.vy = Math.max(pl.vy - (pl.y < goalY ? .55 : 1.0), -11);
        if (frame % 3 === 0) burst(pcx, pb, 'rgba(190,255,245,.9)', 1);
      }
    }
    pl.inUd = inUd;
    if (rocketOn) {
      pl.vy = -38;
      burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffb14d', 2);
      if (hm >= ROCKET_M) { rocketOn = false; pl.vy = JMP; }
    }
    pl.y += pl.vy;
    pl.sq *= .85;
    if (pl.vy < -17) burst(pl.x + pl.w / 2, pl.y + pl.h, '#ff9a3d', 1);
    if (pl.landT > 0) pl.landT--;
    if (equip.trail !== 'none') { if (frame % 2 === 0) trailPart(equip.trail); }
    else if (CH.key === 'king' && frame % 3 === 0) {
      parts.push({ x: pl.x + pl.w / 2 + rnd(-8, 8), y: pl.y + pl.h * .5,
                   vx: rnd(-.4, .4), vy: rnd(.2, 1), life: .7, c: '#ffe27a', r: rnd(1.2, 2.4) });
    }

    if (pl.vy > 0) {
      for (var i = 0; i < plats.length; i++) {
        var p = plats[i];
        if (p.dead) continue;
        if (p.type === HOLO && !holoOn(p)) continue;
        if (p.type === UPDRAFT) continue;
        if (p.type === CRUMBLE && p.fallT > 18) continue;
        var foot = pl.y + pl.h, prev = foot - pl.vy;
        if (pl.x + pl.w > p.x && pl.x < p.x + p.w && foot >= p.y && prev <= p.y) {
          if (p.type === GLASS && p.crack) {
            p.dead = true;
            Snd.sfx('shatter');
            burst(p.x + p.w / 2, p.y, '#cfe6f7', 10);
            continue;
          }
          pl.y = p.y - pl.h;
          pl.sq = .55;
          pl.landT = 9;
          if (p.type === TRAMPO) { Snd.sfx('spring'); pl.vy = TF; pl.sq = .85; p.hitT = 10; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ff8fbd', 7); }
          else if (p.type === BOOST) { Snd.sfx('boost'); pl.vy = BF; pl.sq = .9; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffe08a', 14); }
          else if (p.type === GLASS) { Snd.sfx('crack'); p.crack = true; pl.vy = JMP; burst(pl.x + pl.w / 2, pl.y + pl.h, '#cfe6f7', 4); }
          else if (p.type === CLOUD) { Snd.sfx('cloud'); p.dip = 1; pl.vy = JMP * .6; pl.sq = .8; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffffff', 6); }
          else if (p.type === CONVEYOR) { Snd.sfx('conveyor'); pl.vy = JMP; pl.kx = p.dir * 4.2; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffc861', 4); }
          else if (p.type === CRUMBLE) { Snd.sfx('crumble'); if (p.fallT === 0) p.fallT = 1; pl.vy = JMP; burst(pl.x + pl.w / 2, pl.y + pl.h, '#c8a87a', 5); }
          else if (p.type === STATION || p.type === MILE) {
            pl.vy = JMP;
            if (!p.got) {
              Snd.sfx('fanfare');
              p.got = true; cheer = 200; cheerMi = p.mi; topMile = p.mi;
              confetti(W / 2, p.y - 50);
              if (p.type === STATION) goalGot = true;
            }
          } else { Snd.sfx(p.type === HOLO ? 'holo' : 'jump'); pl.vy = JMP; }
        }
      }
    }

    for (var j = 0; j < plats.length; j++) {
      var q = plats[j];
      if (q.dead) continue;
      if (q.hitT > 0) q.hitT--;   // ばねが縮んだ絵を出す残り
      if (q.type === GONDOLA) {
        q.x += q.dir * q.sp;
        if (q.x < 0 || q.x + q.w > W) q.dir *= -1;
      } else if (q.type === CLOUD && q.dip > 0) {
        q.dip = Math.max(0, q.dip - .05);
      } else if (q.type === CRUMBLE && q.fallT > 0) {
        q.fallT++;
        if (q.fallT > 18) { q.fv += .45; q.y += q.fv; }
        if (q.y > camY + H + 100) q.dead = true;
      }
    }

    stepFoes();
    stepSpace();

    var want = pl.y - H * .38;
    if (want < camY) camY += (want - camY) * .11;
    var cap = pl.y - H * .14;
    if (cap < camY) camY = cap;

    var cur = Math.floor(hm);
    if (cur > score) { score = cur; elM.textContent = score; checkTitles(); }

    fillUpTo(camY - 120);
    for (var k = plats.length - 1; k >= 0; k--) {
      if (plats[k].y > camY + H + 140) plats.splice(k, 1);

    if (pl.y - camY > H + 60) { if (rescueArmed) rescue(); else over(); }
  }

  function paint() {
    if (run) Snd.music(hm < BG_TOP_M ? 'sky' : 'space');
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawBg();
    drawSpaceBg();
    drawStars();
    drawSpace();
    drawStationFar();
    drawGround();
    for (var i = 0; i < plats.length; i++) drawPlat(plats[i]);
    drawFoes();
    drawParts();
    drawPlayer();
    drawWind();
    drawCheer();
    drawToast();
  }

  // 調整値はすべて 60fps の1ステップ前提。描画の速さに関係なく実時間で 60 ステップ/秒 進める
  var STEP_MS = 1000 / 60, MAX_STEPS = 6;
  var acc = 0, lastT = 0;
  function kick() {
    acc = 0; lastT = performance.now();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    if (!run) return;
    var d = now - lastT;
    lastT = now;
    if (d < 0) d = 0;
    if (d > MAX_STEPS * STEP_MS) d = MAX_STEPS * STEP_MS;
    acc += d;
    while (acc >= STEP_MS && run) {
      frame++;
      step();
      acc -= STEP_MS;
    }
    paint();
    if (run) raf = requestAnimationFrame(loop);
  }

  // ===== 音 =====
  // 音の素材ファイルは使わず、Web Audio でその場で合成する。
  // iOS は指で触った瞬間にしか音を出し始められないので、最初のタップで unlock() する。
  // 音楽は同じメロディを場面ごとに編成を変えて流す(タイトル: 軽く / 空: 太鼓つき / 宇宙: やまびこで広く)

    var ac = null, comp, musicBus, sfxBus, echo, noiseBuf = null, held = false;
    // 音量は、出力を測って決めた(スマホのスピーカーで聞こえる大きさで、割れない所)
    var MUSIC_VOL = 1.0, SFX_VOL = 1.8;
    var pref = { music: true, sfx: true };
    try {

      if (sv) { pref.music = sv.music !== false; pref.sfx = sv.sfx !== false; }
    } catch (e) {}

      musicBus = ac.createGain(); musicBus.gain.value = pref.music ? MUSIC_VOL : 0; musicBus.connect(comp);

      return ac;

    function hz(n) { return 440 * Math.pow(2, (n - 69) / 12); }
    // 1音: 波形・音量・長さ・音程の上がり下がり
    function tone(dest, t, f, dur, o) {

      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(f, t);

    // ざらっとした音(風・割れる・崩れる・太鼓)

      var fl = ac.createBiquadFilter();

      if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur);

      var g = ac.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(o.vol || .3, t + .003);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(fl); fl.connect(g); g.connect(dest);
      src.start(t, Math.random() * .5); src.stop(t + dur + .03);
    }

    // ----- 効果音 -----
    var FX = {
      jump: function (t) { var k = 1 + (Math.random() - .5) * .06; tone(sfxBus, t, 420 * k, .13, { type: 'triangle', to: 820 * k, vol: .16 }); },
      spring: function (t) {
        tone(sfxBus, t, 180, .32, { type: 'triangle', to: 900, vol: .22 });
        tone(sfxBus, t + .04, 360, .26, { type: 'sine', to: 1400, vol: .08 });
      },
      boost: function (t) {
        noise(sfxBus, t, .7, { type: 'highpass', f: 300, to: 5000, vol: .22 });
        tone(sfxBus, t, 160, .6, { type: 'sawtooth', to: 1300, vol: .07 });
      },
      crack: function (t) {
        noise(sfxBus, t, .07, { type: 'highpass', f: 5000, vol: .3 });
        tone(sfxBus, t, 2400, .08, { type: 'sine', vol: .08 });
        FX.jump(t);
      },
      shatter: function (t) {
        noise(sfxBus, t, .35, { type: 'highpass', f: 3500, vol: .35 });
        for (var i = 0; i < 5; i++) tone(sfxBus, t + i * .03, 2600 + Math.random() * 2600, .12, { type: 'sine', vol: .06 });
      },
      crumble: function (t) {
        noise(sfxBus, t, .3, { type: 'lowpass', f: 700, to: 140, vol: .45 });
        FX.jump(t);
      },
      cloud: function (t) {
        noise(sfxBus, t, .32, { type: 'lowpass', f: 1200, to: 260, vol: .2 });
        tone(sfxBus, t, 330, .22, { type: 'sine', to: 220, vol: .1 });
      },
      conveyor: function (t) {
        tone(sfxBus, t, 300, .12, { type: 'square', to: 620, vol: .05 });
        noise(sfxBus, t, .14, { type: 'bandpass', f: 1800, vol: .12 });
        FX.jump(t);
      },
      holo: function (t) { tone(sfxBus, t, 1200, .09, { type: 'sine', to: 1700, vol: .08 }); FX.jump(t); },
      updraft: function (t) { noise(sfxBus, t, .7, { type: 'bandpass', f: 500, to: 1800, q: 1.2, vol: .6 }); },
      hit: function (t) {
        noise(sfxBus, t, .18, { type: 'lowpass', f: 1500, vol: .35 });
        tone(sfxBus, t, 220, .2, { type: 'square', to: 90, vol: .1 });
      },
      rescue: function (t) { FX.spring(t); FX.boost(t + .05); },
      fanfare: function (t) {
        [72, 76, 79, 84].forEach(function (n, i) { tone(sfxBus, t + i * .11, hz(n), .18, { type: 'square', vol: .1 }); });
        [72, 76, 79, 84].forEach(function (n) { tone(sfxBus, t + .44, hz(n), .8, { type: 'triangle', vol: .09 }); });
      },
      chime: function (t) {
        tone(sfxBus, t, hz(88), .9, { type: 'sine', vol: .12 });
        tone(sfxBus, t + .12, hz(91), 1.1, { type: 'sine', vol: .1 });
      },
      friend: function (t) {
        [79, 84, 88, 91, 96].forEach(function (n, i) { tone(sfxBus, t + i * .09, hz(n), .5, { type: 'sine', vol: .1 }); });
      },
      over: function (t) {
        [79, 76, 72, 67].forEach(function (n, i) { tone(sfxBus, t + i * .16, hz(n), .3, { type: 'triangle', vol: .14 }); });
      },
      click: function (t) { tone(sfxBus, t, 900, .05, { type: 'sine', vol: .12 }); },
      coin: function (t) {
        tone(sfxBus, t, hz(88), .1, { type: 'square', vol: .12 });
        tone(sfxBus, t + .08, hz(93), .35, { type: 'square', vol: .12 });
      }
    };
    function sfx(name) {
      if (!pref.sfx || !live() || !FX[name]) return;
      FX[name](ac.currentTime + .005);
    }

    // ----- 音楽 -----
    var BPM = 112, E8 = 60 / BPM / 2;   // 8分音符の長さ(秒)
    // 8小節。和音(アルペジオ用)、ベースの根音、メロディ [音, 8分いくつぶん](-1 は休み)
    var PROG = [[60, 64, 67, 72], [59, 62, 67, 71], [57, 60, 64, 69], [57, 60, 65, 69],
                [60, 64, 67, 72], [59, 62, 67, 71], [57, 60, 65, 69], [59, 62, 67, 71]];
    var ROOT = [36, 43, 45, 41, 36, 43, 41, 43];
    var MEL = [[76, 2], [79, 2], [84, 2], [79, 2], [74, 2], [79, 1], [81, 1], [83, 2], [79, 2],
               [84, 2], [83, 1], [81, 1], [76, 4], [77, 2], [81, 2], [84, 2], [81, 2],
               [79, 2], [76, 1], [79, 1], [84, 2], [88, 2], [86, 2], [83, 2], [79, 4],
               [81, 2], [84, 1], [81, 1], [77, 2], [81, 2], [79, 4], [74, 2], [-1, 2]];
    var melAt = {};   // 何番目の8分でどの音が鳴るか
    (function () { var pos = 0; MEL.forEach(function (m) { if (m[0] > 0) melAt[pos] = m; pos += m[1]; }); })();
    // 宇宙: 同じ和音を、ゆっくり広く
    var mus = { mode: null, want: null, next: 0, step: 0, timer: null };
    function playStep(t) {
      var st = mus.step % 64, bar = (st / 8) | 0, e = st % 8, ch = PROG[bar], mode = mus.mode;
      if (mode === 'space') {
        if (e === 0) {
          ch.forEach(function (n) { tone(musicBus, t, hz(n - 12), E8 * 8, { type: 'sawtooth', vol: .06, att: .6 }); });
          tone(musicBus, t, hz(ROOT[bar] - 12), E8 * 8, { type: 'sine', vol: .22, att: .3 });
        }
        if (e % 2 === 0) tone(musicBus, t, hz(ch[(e / 2) % 4] + 12), E8 * 2, { type: 'sine', vol: .1, echo: true });
        var sm = melAt[st];
        if (sm && bar % 2 === 0) tone(musicBus, t, hz(sm[0]), E8 * sm[1] * 1.6, { type: 'sine', vol: .13, echo: true, att: .05 });
        return;
      }
      // タイトルと空: アルペジオ・メロディ(空はベースと太鼓も)
      var tv = mode === 'title' ? 1.6 : 1;   // タイトルは太鼓もベースも無いぶん、ほかを大きく
      tone(musicBus, t, hz(ch[e % 4]), E8 * .9, { type: 'triangle', vol: .12 * tv });
      var m = melAt[st];
      if (m) tone(musicBus, t, hz(m[0]), E8 * m[1] * .92, { type: 'square', vol: .09 * tv, att: .01 });
      if (mode === 'sky') {
        if (e % 2 === 0) tone(musicBus, t, hz(ROOT[bar]), E8 * 1.8, { type: 'triangle', vol: .16 });
        if (e === 0 || e === 4) tone(musicBus, t, 150, .14, { type: 'sine', to: 45, vol: .14 });
        if (e === 2 || e === 6) noise(musicBus, t, .12, { type: 'bandpass', f: 1800, vol: .12 });
        noise(musicBus, t, .03, { type: 'highpass', f: 7000, vol: .035 });
      }
    }
    function tick() {
      if (!live()) return;
      if (mus.next < ac.currentTime) mus.next = ac.currentTime + .05;
      while (mus.next < ac.currentTime + .15) {
        // 場面の切り替えは小節の頭で(途中でぶつっと変えない)
        if (mus.step % 8 === 0 && mus.want !== mus.mode) mus.mode = mus.want;
        if (!mus.mode) { stopTimer(); return; }
        playStep(mus.next);
        mus.next += E8; mus.step++;
      }
    }
    function stopTimer() { if (mus.timer) { clearInterval(mus.timer); mus.timer = null; } }
    // 流す曲を決める。null で止める。
    // now: 場面が変わったとき(タイトル → ゲームなど)は、すぐ頭から切り替える。
    // 高さで変わるとき(空 → 宇宙)は now を付けず、小節の頭で切り替える(途中でぶつっと変えない)
    function music(mode, now) {
      if (!init()) return;
      mus.want = mode;
      if (!mode) { mus.mode = null; stopTimer(); return; }
      if (now || !mus.mode) {
        if (mus.mode !== mode || now) { mus.mode = mode; mus.step = 0; mus.next = 0; }
      }
      if (!mus.timer) mus.timer = setInterval(tick, 25);
    }
    // 一時停止・アプリの切り替え中は、音をまるごと止める
    function hold(on) {
      held = on;
      if (!ac) return;
      if (on) ac.suspend(); else ac.resume();
    }
    function set(kind, on) {
      pref[kind] = on;
      try { localStorage.setItem('skyJumpSound', JSON.stringify(pref)); } catch (e) {}
      if (ac) {
        musicBus.gain.value = pref.music ? MUSIC_VOL : 0;
        sfxBus.gain.value = pref.sfx ? SFX_VOL : 0;
      }
    }
    return { unlock: unlock, sfx: sfx, music: music, hold: hold, set: set, pref: pref,
             state: function () { return { ac: ac ? ac.state : 'none', mode: mus.mode, step: mus.step }; } };
  })();

  // ===== 進行 =====
  function start() {
    // 使う品は開始時に1つ減らしてチェックを外す(「もう一度」で勝手に減らない)。救出ばねは助かった時だけ減る
    ticketActive = false; rocketOn = false;
    if (useSel.ticket && stock.ticket > 0) { stock.ticket--; ticketActive = true; useSel.ticket = false; }
    rocketUsed = false;
    if (useSel.rocket && stock.rocket > 0) { stock.rocket--; rocketOn = rocketUsed = true; useSel.rocket = false; }
    rescueArmed = !!useSel.rescue && stock.rescue > 0;
    saveStock();
    renderItemToggles();
    fit(); initBg();
    score = 0; camY = 0; frame = 0; hm = 0; invuln = 0;
    parts = []; foes = []; plats = [];
    droneT = 260; debrisT = 300;
    wind = 0; windTo = 0; windT = 260;
    goalGot = false; cheer = 0; cheerMi = 0; topMile = -1; lv = 0;
    runTitles = []; runUnlocks = []; toastQ = []; toastT = 0;
    elM.textContent = '0';
    groundY = H - 30;
    goalY = mToY(GOAL_M);
    mileIdx = 0; mileY = goalY;
    var g = mk(0, groundY, BEAM, W);
    g.h = 30; g.ground = true;
    plats.push(g);
    genY = groundY;
    recentSpine = []; recentBonus = []; afterMile = false;
    fillUpTo(-H * .6);
    pl = newPlayer();
    Snd.unlock(); Snd.hold(false); Snd.music('sky', true);
    if (rocketOn) Snd.sfx('boost');
    vStart.classList.remove('on');
    vOver.classList.remove('on');
    paused = false;
    vPause.classList.remove('on');
    bPause.classList.add('show');
    run = true;
    kick();
  }

  // 救出ばね: 画面の下に大きなばねを出して、ロケット床の勢いで打ち上げる
  function rescue() {
    rescueArmed = false;
    stock.rescue--; saveStock();
    if (stock.rescue <= 0) useSel.rescue = false;
    var y = camY + H - 40;
    plats.push(mk(pl.x + pl.w / 2 - 50, y, TRAMPO, 100));
    pl.y = y - pl.h; pl.vy = BF; pl.kx = 0; pl.sq = .9; pl.landT = 9;
    invuln = 90;
    Snd.sfx('rescue');
    burst(pl.x + pl.w / 2, y, '#ff8fbd', 16);
    toastQ.unshift('🌀 救出ばね！'); toastT = 0;
  }

  function over() {
    run = false;
    Snd.music(null); Snd.sfx('over');
    bPause.classList.remove('show');
    saveBest();
    var got = runCoins();
    if (got > 0) addCoins(got);
    elOM.textContent = score;
    $('oCoin').textContent = got > 0 ? ('+' + got + ' コイン' + (CH.coin ? '(' + CH.coin + '倍)' : '')) : '';
    var news = runUnlocks.map(function (n) { return n + 'が仲間になった！'; });
    if (runTitles.length) news.push('称号「' + runTitles.join('」「') + '」を手に入れた！');
    elNote.textContent = news.length ? news.join(' ')
      : topMile >= 0 ? mileName(topMile) + '(' + mileAt(topMile) + 'm)に到達'
      : (score >= best && score > 0 ? 'ベスト更新' : 'ベストまで あと ' + Math.max(1, best - score) + 'm');
    vOver.classList.add('on');
  }

  function pause() {
    if (!run) return;
    run = false; paused = true;
    if (raf) cancelAnimationFrame(raf);
    touchX = null; keys = {};
    Snd.hold(true);
    vPause.classList.add('on');
  }
  function resume() {
    if (!paused) return;
    paused = false;
    vPause.classList.remove('on');
    Snd.hold(false);
    run = true;
    kick();
  }
  function quitToTitle() {
    paused = false; run = false;
    if (raf) cancelAnimationFrame(raf);
    saveBest();
    if (runCoins() > 0) addCoins(runCoins());
    vPause.classList.remove('on');
    bPause.classList.remove('show');
    vOver.classList.remove('on');
    vStart.classList.add('on');
    buildPicker();
    title();
    Snd.hold(false); Snd.music('title', true);
  }

  // ===== 操作 =====
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { pause(); Snd.hold(true); }
    else if (!paused) Snd.hold(false);
  });
  // 音: iOS は指で触った瞬間にしか鳴らし始められない。最初のタップで起こし、タイトルなら曲を流す。
  // ボタンを押したら小さな音(始める・もう一度は、始まりの音があるので鳴らさない)
  document.addEventListener('click', function (e) {
    Snd.unlock();
    if (!run && !paused && !vOver.classList.contains('on')) Snd.music('title');
    var b = e.target.closest && e.target.closest('button');
    if (b && b.id !== 'bStart' && b.id !== 'bRetry') Snd.sfx('click');
  });
  window.addEventListener('pagehide', pause);
  document.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (run) pause();
      else if (paused) resume();
    }
  });
  document.addEventListener('keyup', function (e) { keys[e.code] = false; });

  function tx(e) {
    var r = cv.getBoundingClientRect();
    return e.touches[0].clientX - r.left;
  }
  fit();
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); touchX = tx(e); }, { passive: false });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); touchX = tx(e); }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); touchX = null; }, { passive: false });
  cv.addEventListener('mousedown', function (e) {
    var r = cv.getBoundingClientRect(); touchX = e.clientX - r.left;
  });
  cv.addEventListener('mousemove', function (e) {
    if (touchX === null) return;
    var r = cv.getBoundingClientRect(); touchX = e.clientX - r.left;
  });
  window.addEventListener('mouseup', function () { touchX = null; });

  window.addEventListener('resize', function () {
    var wasRun = run;
    fit(); initBg();
    if (!wasRun && !paused) title();
  });

  $('bStart').addEventListener('click', start);
  $('bRetry').addEventListener('click', start);
  $('bChange').addEventListener('click', function () {
    vOver.classList.remove('on');
    Snd.music('title', true);
    buildPicker();
    title();
    vChars.classList.add('on');
  });
  $('bChars').addEventListener('click', function () { vStart.classList.remove('on'); vChars.classList.add('on'); });
  $('bCharsOk').addEventListener('click', function () { vChars.classList.remove('on'); vStart.classList.add('on'); });
  function renderSoundUI() {
    $('bMusic').textContent = '🎵 音楽: ' + (Snd.pref.music ? 'オン' : 'オフ');
    $('bSfx').textContent = '🔊 効果音: ' + (Snd.pref.sfx ? 'オン' : 'オフ');
  }
  renderSoundUI();
  $('bMusic').addEventListener('click', function () { Snd.set('music', !Snd.pref.music); renderSoundUI(); });
  $('bSfx').addEventListener('click', function () { Snd.set('sfx', !Snd.pref.sfx); renderSoundUI(); });
  $('bMenu').addEventListener('click', function () { renderTitleUI(); vStart.classList.remove('on'); vMenu.classList.add('on'); });
  $('bMenuClose').addEventListener('click', function () { vMenu.classList.remove('on'); vStart.classList.add('on'); });
  bPause.addEventListener('click', pause);
  $('bResume').addEventListener('click', resume);
  $('bQuit').addEventListener('click', quitToTitle);
  $('bShop').addEventListener('click', openShop);
  $('bShopClose').addEventListener('click', closeShop);
  $('bTitles').addEventListener('click', openTitles);
  $('bTitlesClose').addEventListener('click', closeTitles);

  // ===== タイトルの絵 =====
  // 青空から夕焼けへ抜ける明るい空。もこもこの雲・きらめき・遠くの街。止まった絵なので一度だけ描く
  // いただいた縦長の絵(画面と同じ縦横比)を、画面いっぱいに敷く
  var titleImg = new Image();
  titleImg.onload = function () { if (!run && !paused) title(); };
  titleImg.src = 'title-v2.jpg';
  function title() {
    // ゲームが空の色を入れ直せるよう、覚えている色を忘れさせる
    // 単色で指定すると、あとでゲームがグラデーションに戻しても Chrome が描き直さず、
    // 単色の青がずっと残った(指定の値は変わっているのに画面の画素が変わらない)。グラデーションで指定する
    skyCss = ''; $('board').style.background = 'linear-gradient(#3f8ff0, #3f8ff0)';
    hideBg();
    ctx.clearRect(0, 0, W, H);
    if (!titleImg.naturalWidth) return;
    var iw = titleImg.naturalWidth, ih = titleImg.naturalHeight;
    var s = Math.max(W / iw, H / ih);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(titleImg, (W - iw * s) / 2, (H - ih * s) / 2, iw * s, ih * s);
  }

  loadSprites();
  loadBest();
  applyChar();
  buildPicker();
  groundY = H - 30;
  title();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
