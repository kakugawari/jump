<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>スカイホッパー</title>
<meta name="theme-color" content="#2b2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スカイホッパー">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --navy: #0a1230;
    --deep: #05070f;
    --sky: #4aa3e8;
    --lime: #7ee08a;
    --amber: #ff9a3d;
    --cyan: #3dd6f5;
    --paper: #eef3f8;
    --bg: var(--deep);
  }
  :root:not([data-theme="light"]) { --bg: var(--deep); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: var(--deep); }
  }
  :root[data-theme="dark"] { --bg: var(--deep); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* ホーム画面から開くと %・dvh は 873 しか渡らず下に帯が出る。根っこを 100vh(932)にすると渡る高さ自体が 932 になる */
  html, body {
    margin: 0; padding: 0; height: 100vh;
    background: var(--bg); overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--paper);
  }
  #stage { position: absolute; inset: 0; }
  #board { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 62px 0 14px;
    display: flex; align-items: baseline; gap: 12px;
    pointer-events: none; z-index: 5;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .h-num { font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #fff; font-variant-numeric: tabular-nums; }
  .h-unit { font-size: 13px; opacity: .75; margin-left: 3px; font-weight: 600; }
  .h-best { margin-left: auto; font-size: 12px; opacity: .7; font-weight: 600; }

  .pausebtn {
    position: absolute; z-index: 6;
    top: calc(env(safe-area-inset-top) + 8px); right: 14px;
    width: 38px; height: 38px; padding: 0; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    box-shadow: none; pointer-events: auto;
  }
  .pausebtn.show { display: flex; }

  .veil {
    position: absolute; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 40%, rgba(10,18,48,.86), rgba(5,7,15,.96));
  }
  .veil.on { display: flex; }
  .card { text-align: center; padding: 26px 22px; max-width: 320px; }
  .logo { position: relative; margin: 14px 0 4px; }
  .logo h1 {
    margin: 0 -16px; font-size: 36px; line-height: 1.1; color: #fff; white-space: nowrap;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; font-weight: 800;
    -webkit-text-stroke: 1.4px #fff;
    text-shadow: 0 3px 0 #6f9fe0, 0 8px 18px rgba(20,40,100,.45);
    transform: rotate(-5deg);
  }
  .logo svg { position: absolute; left: 50%; top: -22px; width: 150px; height: 34px; margin-left: -62px; overflow: visible; }
  .tagline {
    margin: 16px 0 12px; font-size: 14px; font-weight: 800; letter-spacing: .04em; color: #fff;
    transform: rotate(-3deg); text-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
  .card p { margin: 0 0 20px; font-size: 14px; line-height: 1.85; opacity: .82; }
  .card .big { font-size: 46px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .card .note { color: var(--sky); font-size: 14px; font-weight: 600; min-height: 1.4em; margin: 2px 0 16px; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .04em;
    color: #04121f; background: linear-gradient(180deg, #7fdcff, var(--sky));
    border: 0; border-radius: 12px; padding: 14px 36px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(74,163,232,.35);
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button:active { transform: translateY(1px); }
  button.ghost {
    margin-top: 12px; background: none; color: var(--paper);
    box-shadow: none; border: 1px solid rgba(255,255,255,.3);
    font-size: 13px; padding: 9px 20px; opacity: .85;
  }
  .picker { display: flex; justify-content: center; gap: 6px; margin: 4px 0 10px; }
  .slot {
    position: relative; width: 62px; padding: 5px 0 6px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,.07); border: 2px solid transparent;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .slot.on { border-color: #fff; background: rgba(255,255,255,.17); }
  .slot span { font-size: 9.5px; font-weight: 700; opacity: .9; white-space: nowrap; }
  /* 封じてある物は色を残したまま暗幕を一枚かける(filter で沈めると壊れて見える) */
  .slot .seal {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(8,12,34,.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 11px; font-weight: 800;
  }
  .pinfo { font-size: 12.5px; line-height: 1.7; min-height: 3.4em; opacity: .85; margin-bottom: 14px; }

  .coinbar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 10px; }
  .coin-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .coin-pill.big-pill { font-size: 16px; padding: 7px 16px; margin: 2px 0 14px; }
  .shopbtn { padding: 8px 16px; font-size: 12.5px; }

  .shop-card { max-width: 340px; }
  .shop-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: min(400px, 55vh); overflow-y: auto;
    margin-bottom: 16px; text-align: left;
  }
  .shop-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 8px 10px;
  }
  .shop-thumb { width: 40px; height: 40px; flex: none; }
  .shop-thumb.ticket-thumb {
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: rgba(255,255,255,.1); border: 2px dashed rgba(255,255,255,.3);
  }
  .shop-info { flex: 1; min-width: 0; }
  .shop-name { font-size: 13px; font-weight: 700; }
  .shop-desc { font-size: 11px; opacity: .75; line-height: 1.5; margin-top: 2px; }
  .buybtn {
    flex: none; font-size: 12px; padding: 8px 12px; border-radius: 10px;
    box-shadow: none; background: linear-gradient(180deg, #7fdcff, var(--sky));
  }
  .buybtn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .owned-tag { flex: none; font-size: 11px; opacity: .6; font-weight: 700; }

  .item-toggles { font-size: 12px; margin: 2px 0 12px; opacity: .9; display: flex; flex-direction: column; gap: 6px; }
  .item-toggles label { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  .shop-sec { font-size: 12px; font-weight: 800; letter-spacing: .08em; opacity: .7; margin: 6px 2px -2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 11.5px; padding: 7px 10px; border-radius: 999px; letter-spacing: 0;
    color: var(--paper); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); box-shadow: none;
  }
  .chip.on { background: #fff; color: #04121f; border-color: #fff; }
  .chip.buy { background: linear-gradient(180deg, #7fdcff, var(--sky)); color: #04121f; border: 0; }
  .chip.sure { background: linear-gradient(180deg, #ffe27a, #ffb14d); }
  .chip:disabled { opacity: .35; }

  .titlebtn { margin: 0 0 10px; padding: 6px 14px; font-size: 12.5px; }
  .titlebtn .tcount { opacity: .6; font-size: 11px; margin-left: 4px; }
  .shop-row.off { opacity: .55; }
  .ver { margin-top: 12px; font-size: 10px; opacity: .45; letter-spacing: .05em; }
  .oCoin { color: var(--lime); font-size: 13px; font-weight: 700; min-height: 1.2em; margin: -8px 0 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <canvas id="cv"></canvas>
    <button id="bPause" class="pausebtn" aria-label="一時停止">❚❚</button>

    <div class="hud">
      <div><span class="h-num" id="hM">0</span><span class="h-unit">m</span></div>
      <div class="h-best">ベスト <span id="hBest">0</span>m</div>
    </div>

    <div class="veil on" id="vStart">
      <div class="card">
        <div class="logo">
          <svg viewBox="0 0 150 34" aria-hidden="true">
            <path d="M6 30 C 40 8, 90 4, 138 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M126 3 L 140 10 L 128 19" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>スカイジャンパー</h1>
        </div>
        <div class="tagline">＼ いろんな個性で、もっと高く！ ／</div>
        <p>ビルの屋上から足場を乗り継いで、<br>夕焼けの雲をぬけて宇宙ステーションへ。</p>
        <div class="coinbar">
          <span class="coin-pill">🪙 <span id="coinCount">0</span></span>
          <button class="ghost shopbtn" id="bShop">ショップ</button>
        </div>
        <button class="ghost titlebtn" id="bTitles">🏅 <span id="titleName">称号なし</span>
          <span class="tcount" id="titleCount"></span></button>
        <div class="picker" id="picker"></div>
        <div class="pinfo" id="pinfo"></div>
        <div class="item-toggles" id="itemToggles"></div>
        <button id="bStart">スタート</button>
        <div class="ver">版 2026-09-24g</div>
      </div>
    </div>

    <div class="veil" id="vOver">
      <div class="card">
        <h2>落下</h2>
        <div class="big"><span id="oM">0</span><span style="font-size:18px">m</span></div>
        <div class="oCoin" id="oCoin"></div>
        <div class="note" id="oNote"></div>
        <button id="bRetry">もう一度</button>
        <div><button class="ghost" id="bChange">キャラを変える</button></div>
      </div>
    </div>

    <div class="veil" id="vPause">
      <div class="card">
        <h2>一時停止</h2>
        <p>すこし休んでから、また跳ぼう。</p>
        <button id="bResume">つづける</button>
        <div><button class="ghost" id="bQuit">タイトルへ</button></div>
      </div>
    </div>

    <div class="veil" id="vTitles">
      <div class="card shop-card">
        <h2>称号</h2>
        <div class="shop-list" id="titleList"></div>
        <button class="ghost" id="bTitlesClose">とじる</button>
      </div>
    </div>

    <div class="veil" id="vShop">
      <div class="card shop-card">
        <h2>ショップ</h2>
        <div class="coin-pill big-pill">🪙 <span id="shopCoinCount">0</span></div>
        <div class="shop-list" id="shopList"></div>
        <button class="ghost" id="bShopClose">とじる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===== 調整値 =====
  var G = 0.35;            // ふわっと長め
  var LOWG = 0.18;         // 宇宙の低重力
  var JUMP = -9.5;         // 到達高 ≒ 129px（低重力なら約251px）
  var TRAMPO_F = -13.6;
  var BOOST_F = -20.5;
  var SPEED = 5.0;
  var PXM = 10;
  var SAFE_GAP = 104;      // 消えない足場どうしの最大間隔（129px未満）
  var SAFE_GAP_LOW = 205;  // 低重力ゾーンでの最大間隔（251px未満）
  var GOAL_M = 2000;       // 宇宙ステーション
  var PW = 0.17;
  var PH = 11;

  var BEAM = 0, GONDOLA = 1, TRAMPO = 2, BOOST = 3,
      GLASS = 4, CLOUD = 5, HOLO = 6, STATION = 7,
      CONVEYOR = 8, CRUMBLE = 9, MILE = 10, UPDRAFT = 11;
  var UPDRAFT_H = 170;      // 上昇気流の柱の高さ(下端が p.y)

  var SKY = [
    { m: 0,    t: [96, 78, 156],  b: [252, 168, 98] },
    { m: 400,  t: [68, 54, 124],  b: [214, 112, 118] },
    { m: 1000, t: [36, 32, 88],   b: [122, 64, 122] },
    { m: 1550, t: [14, 16, 52],   b: [50, 36, 88] },
    { m: 2050, t: [2, 3, 12],     b: [12, 14, 42] }
  ];

  // 性能は「ジャンプ 8.9 以上」を守る（それ未満だと届かない足場が出る）
  var CHARS = [
    { key: 'usagi', n: 'バネうさぎ', tag: 'ジャンプ特化',
      jump: 11.2, speed: 4.6, grav: 1.0, wind: 1.0,
      t: 'ぴょーん！と高く跳ぶのが得意！誰よりも高く、空を目指そう！' },
    { key: 'kumo', n: 'わたぐも', tag: 'ふわふわ浮く',
      jump: 9.4, speed: 4.9, grav: .78, wind: 1.25,
      t: 'ふわふわと空中に浮かぶのが得意！ゆっくり降りて、のんびり登ろう。' },
    { key: 'ninja', n: 'たまご忍者', tag: 'バランス型',
      jump: 9.8, speed: 5.6, grav: 1.0, wind: .6,
      t: 'どんな足場でもバランスをとるのが得意！安定して、着実に登ろう。' },
    { key: 'king', n: 'スターキング', tag: '全部乗せ最強', unlockM: 10000, coin: 1.5, tough: true,
      jump: 11.2, speed: 6.2, grav: .82, wind: .45,
      t: 'ジャンプも、浮遊も、報酬も全部できる！この子がいれば間違いない！(コイン1.5倍)' }
  ];
  // 使い切りの品。rescue だけは「持っていく」で、助かった時にだけ減る
  var ITEMS = [
    { id: 'ticket', n: 'ブーストチケット', icon: '🎫', price: 1000, use: '使う',
      t: 'その回だけ、ジャンプ床とロケット床が出やすくなる。' },
    { id: 'rocket', n: 'ロケットスタート', icon: '🚀', price: 2000, use: '使う',
      t: 'スタートと同時に 1000m まで一気に飛ぶ。飛んでいる間は何にも当たらない。飛んだぶんはコインにならない。' },
    { id: 'rescue', n: '救出ばね', icon: '🌀', price: 1500, use: '持っていく',
      t: '落ちた時に1回だけ、ばねが出て助けてくれる。助かった時にだけ減る。' }
  ];
  var ROCKET_M = 1000;
  // 1回の収入(2000〜5000コインほど)から逆算し、全部集めるのに30〜60回かかる値段にしている
  function skinPrice(key) { return key === 'king' ? 15000 : 8000; }
  // 色違い。0 番がもとの色
  var SKINS = {
    usagi: [
      { n: 'もとの色', body: '#58b8f6', line: '#2b84cf', spring: '#2f7fd6', inner: '#ffb3c7' },
      { n: 'ピンク', body: '#ff9ec7', line: '#d9669b', spring: '#d9669b', inner: '#fff0f6' },
      { n: 'ラベンダー', body: '#b79cff', line: '#7d5fd6', spring: '#7d5fd6', inner: '#ffd6ec' }],
    kumo: [
      { n: 'もとの色', puff: '#fff', line: '#c7c0e8', shade: '214,208,245', feet: '#58b8f6' },
      { n: '夕焼け', puff: '#ffe1c7', line: '#f0a37a', shade: '255,170,140', feet: '#ff8a5b' },
      { n: '雷雲', puff: '#9aa1b5', line: '#6a7086', shade: '60,64,82', feet: '#ffd84a' }],
    ninja: [
      { n: 'もとの色', body: '#fbf8ef', line: '#cfc4a6', shade: '235,224,196', band: '#3aa35b', dark: '#2a7f45', limb: '#2f6b3f' },
      { n: '影忍者', body: '#8a8fa3', line: '#555a6b', shade: '60,62,78', band: '#e8403f', dark: '#b52a2d', limb: '#2d3040' },
      { n: '桜忍者', body: '#fff4f7', line: '#e8b4c4', shade: '255,205,220', band: '#ff8fb1', dark: '#e0668c', limb: '#c9557a' }],
    king: [
      { n: 'もとの色', star: '#ffd84a', line: '#e8a317', glow: '255,250,200', cape: '#e8403f', capeLine: '#b52a2d' },
      { n: '白銀', star: '#e9eef7', line: '#9aa7ba', glow: '255,255,255', cape: '#3a6fd6', capeLine: '#244a9a' },
      { n: 'ルビー', star: '#ff7f93', line: '#d6405a', glow: '255,220,230', cape: '#7a3fd6', capeLine: '#522a94' }]
  };
  var TRAILS = [
    { id: 'none', n: 'なし' },
    { id: 'star', n: '★ 星', price: 12000 },
    { id: 'heart', n: '♥ ハート', price: 12000 },
    { id: 'sakura', n: '🌸 桜', price: 12000 },
    { id: 'rainbow', n: '🌈 虹', price: 20000 }
  ];

  // 区切り: 2000(宇宙ステーション) → 5000 → 10000 → 以降1万ごと
  function mileAt(i) { return i === 0 ? GOAL_M : i === 1 ? 5000 : 10000 * (i - 1); }
  var MILE_NAMES = ['宇宙ステーション', '月面基地', '星の港', '銀河ゲート'];
  function mileName(i) { return MILE_NAMES[Math.min(i, MILE_NAMES.length - 1)]; }
  // 2000m より上は区切りを越えるたびに一段むずかしく。足場の間隔は変えないので必ず登れる
  var MAX_LV = 5;
  function zoneLv(m) { var L = 0; while (L < MAX_LV && m >= mileAt(L + 1)) L++; return L; }

  var TITLES = [
    { id: 'h500', n: 'ビルの上の新人', m: 500 },
    { id: 'h1000', n: '夕焼けを越えた者', m: 1000 },
    { id: 'h2000', n: '宇宙飛行士', m: 2000 },
    { id: 'h5000', n: '月面の旅人', m: 5000 },
    { id: 'h10000', n: '星の開拓者', m: 10000 },
    { id: 'h20000', n: '銀河の旅人', m: 20000 },
    { id: 'h30000', n: '銀河の覇者', m: 30000 },
    { id: 'h50000', n: '伝説のジャンパー', m: 50000 },
    { id: 'c_usagi', n: 'ばねの達人', m: 2000, ch: 'usagi' },
    { id: 'c_kumo', n: 'ふわふわ名人', m: 2000, ch: 'kumo' },
    { id: 'c_ninja', n: '天空の忍', m: 2000, ch: 'ninja' },
    { id: 'c_king', n: '真の王', m: 2000, ch: 'king' }
  ];
  var sel = 0, CH, JMP, TF, BF;
  var coins = 0, owned = {}, ticketActive = false;
  // stock: 使い切りの品の数 / equip: 付けている色と跡 / useSel: タイトルで付けたチェック
  var stock = { ticket: 0, rocket: 0, rescue: 0 }, equip = { skin: {}, trail: 'none' }, useSel = {};
  var rocketOn = false, rocketUsed = false, rescueArmed = false, pendingBuy = '';

  var cv, ctx, W, H, dpr;
  var run = false, paused = false;
  var score = 0, best = 0;
  var pl, plats, parts, foes, clouds, stars, bokeh, planes;
  var camY = 0, groundY = 0, goalY = 0, genY = 0;
  var goalGot = false, cheer = 0, cheerMi = 0, topMile = -1;
  var mileIdx = 0, mileY = 0, lv = 0;
  // 称号は記録(ベスト)とは別に持つ。記録を消しても閉じない
  var titles = {}, runTitles = [], runUnlocks = [], toastQ = [], toastText = '', toastT = 0;
  var keys = {}, touchX = null;
  var frame = 0, hm = 0, invuln = 0;
  var droneT = 0, debrisT = 0, planeT = 0;
  var wind = 0, windTo = 0, windT = 260;
  var raf = null;

  var $ = function (id) { return document.getElementById(id); };
  var elM = $('hM'), elBest = $('hBest'), elOM = $('oM'), elNote = $('oNote');
  var vStart = $('vStart'), vOver = $('vOver'), vPause = $('vPause'), vShop = $('vShop'), vTitles = $('vTitles'), bPause = $('bPause');

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

  function loadBest() {

      coins = parseInt(localStorage.getItem('skyHopCoins') || '0', 10) || 0;
      var sk = JSON.parse(localStorage.getItem('skyJumpStock') || 'null');
      if (sk) { for (var id in stock) stock[id] = sk[id] | 0; }
      else stock.ticket = parseInt(localStorage.getItem('skyHopTickets') || '0', 10) || 0;
      var eq = JSON.parse(localStorage.getItem('skyJumpEquip') || 'null');
      if (eq) { equip.skin = eq.skin || {}; equip.trail = eq.trail || 'none'; }
      owned = JSON.parse(localStorage.getItem('skyHopOwned') || '{}') || {};
      for (var u = 0; u < CHARS.length; u++) if (CHARS[u].unlockM && best >= CHARS[u].unlockM) owned[CHARS[u].key] = true;
      var i = findChar(localStorage.getItem('skyJumpChar'));
      if (i >= 0 && !isLocked(CHARS[i])) sel = i;
      titles = JSON.parse(localStorage.getItem('skyJumpTitles') || '{}') || {};

  // ===== 背景 =====
  // 動かない背景は一度だけ別キャンバスに描いて、毎フレームは貼るだけにする

    var c = document.createElement('canvas');

  var CLOUD_SHAPES = [
    [[0, 0, .8], [-.55, .2, .55], [.55, .15, .6], [-.25, -.4, .55], [.3, -.35, .5], [0, .35, .6]],
    [[0, 0, .7], [-.7, .25, .45], [.7, .25, .45], [-.3, -.35, .5], [.25, -.45, .55], [.05, .3, .6], [-.95, .4, .3]],
    [[0, .05, .75], [-.5, .25, .5], [.5, .2, .55], [0, -.45, .55], [.85, .35, .35], [-.85, .35, .35]]
  ];
  // 高さで雲の色を変える(夕焼け → 夕暮れ → 夜)
  var CLOUD_TINTS = [
    { fill: '#fff1e4', line: 'rgba(255,190,150,.9)', shade: '255,170,140' },
    { fill: '#fbe8f2', line: 'rgba(220,170,205,.9)', shade: '210,150,200' },
    { fill: '#eeecff', line: 'rgba(185,180,235,.9)', shade: '175,170,230' }
  ];
  var cloudImgs = {}, bokehImg = null, nearCityImg = null, farCityImg = null;
  var CITY_TOP = 200, FAR_TOP = 270;
  function cloudImg(tint, shape) {
    var k = tint + ':' + shape;
    if (cloudImgs[k]) return cloudImgs[k];
    var T = CLOUD_TINTS[tint], S = CLOUD_SHAPES[shape];
    cloudImgs[k] = sprite(120, 64, function (g) {
      cloudPath(g, 60, 34, 44, 20, S);
      g.strokeStyle = T.line; g.lineWidth = 3; g.stroke();
      g.fillStyle = T.fill; g.fill();
      g.save();
      cloudPath(g, 60, 34, 44, 20, S); g.clip();
      var gr = g.createLinearGradient(0, 14, 0, 58);
      gr.addColorStop(.35, 'rgba(' + T.shade + ',0)'); gr.addColorStop(1, 'rgba(' + T.shade + ',.75)');
      g.fillStyle = gr; g.fillRect(0, 0, 120, 64);
      g.restore();
    });
    return cloudImgs[k];
  }
  function buildCity(w, top, lo, hi, body, roof, winOn, winOff, onRate) {
    return sprite(w, top + 120, function (g) {
      var x = -30, i = 0;
      while (x < w + 40) {
        var bw = rnd(26, 60), bh = rnd(lo, hi), bx = x, by = top;
        g.fillStyle = body; g.fillRect(bx, by - bh, bw, bh + 120);
        g.fillStyle = roof; g.fillRect(bx, by - bh, bw, 3);
        if (Math.random() < .3) { g.fillRect(bx + bw * .5 - 1, by - bh - 12, 2, 12); }
        for (var wy = by - bh + 8; wy < by + 40; wy += 12) {
          for (var wx = bx + 5; wx < bx + bw - 5; wx += 10) {
            var on = ((wx * 7 + wy * 13 + i * 31) % 11) < onRate;
            g.fillStyle = on ? winOn : winOff;
            rr2(g, wx, wy, 5, 6, 1.2); g.fill();

  function rr2(g, x, y, w, h, r) {

    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function initBg() {

    }
    clouds.sort(function (a, b) { return a.f - b.f; });
    bokeh = [];
    for (i = 0; i < 14; i++) bokeh.push({ x: rnd(0, W), y: rnd(0, H * 2), s: rnd(.6, 1.4), ph: rnd(0, 6.28) });

  function skyPair() {
    var a = SKY[0], b = SKY[0];
    for (var i = 0; i < SKY.length; i++) {
      if (SKY[i].m <= hm) { a = SKY[i]; b = SKY[i]; }
      if (SKY[i].m > hm) { b = SKY[i]; break; }
    }
    var t = b.m === a.m ? 0 : (hm - a.m) / (b.m - a.m);
    function mix(c1, c2) {
      return 'rgb(' + Math.round(c1[0] + (c2[0] - c1[0]) * t) + ',' +
                      Math.round(c1[1] + (c2[1] - c1[1]) * t) + ',' +
                      Math.round(c1[2] + (c2[2] - c1[2]) * t) + ')';
    }
    return [mix(a.t, b.t), mix(a.b, b.b)];
  }

  // 全画面のグラデーションを毎フレーム塗ると遅い端末で倍重くなるので、CSS の背景に任せる
  var skyCss = '';
  function drawSky() {
    var c = skyPair();
    var css = 'linear-gradient(' + c[0] + ',' + c[1] + ')';
    if (css !== skyCss) { skyCss = css; cv.style.background = css; }
  }

  var SUN_R = 170, sunImg = null;
  function sunSprite() {
    if (sunImg) return sunImg;
    var s = document.createElement('canvas');
    s.width = s.height = Math.ceil(SUN_R * 2 * dpr);
    var c = s.getContext('2d');
    c.scale(dpr, dpr);
    var g = c.createRadialGradient(SUN_R, SUN_R, 26, SUN_R, SUN_R, SUN_R);
    g.addColorStop(0, 'rgba(255,205,130,.6)');
    g.addColorStop(.45, 'rgba(255,170,110,.22)');
    g.addColorStop(1, 'rgba(255,150,90,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(SUN_R, SUN_R, SUN_R, 0, 6.2832); c.fill();
    var core = c.createRadialGradient(SUN_R - 8, SUN_R - 8, 4, SUN_R, SUN_R, 32);
    core.addColorStop(0, '#fff3c4'); core.addColorStop(1, '#ffd27a');
    c.fillStyle = core;
    c.beginPath(); c.arc(SUN_R, SUN_R, 32, 0, 6.2832); c.fill();
    sunImg = s;
    return s;
  }
  function drawSun() {
    var fade = Math.max(0, 1 - Math.max(0, hm - 260) / 420);
    if (fade <= .01) return;
    var x = W * .22;
    var y = (groundY - 300) - camY * .1;
    if (y > H + 140 || y < -140) return;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.drawImage(sunSprite(), x - SUN_R, y - SUN_R, SUN_R * 2, SUN_R * 2);
    ctx.restore();
  }

  function drawStars() {
    var a = Math.max(0, Math.min(1, (hm - 550) / 650));
    if (a <= 0) return;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var y = ((s.y - camY * .22) % (H * 3) + H * 3) % (H * 3) - H;
      if (y < -4 || y > H + 4) continue;
      var tw = .8 + .2 * Math.sin(frame * .05 + i);
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,' + (s.a * a * tw) + ')'; ctx.fill();
    }
  }

  function drawClouds() {
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var y = mToY(c.m) - camY * c.f;
      if (y < -70 || y > H + 70) continue;
      c.x += wind * .55 * c.f;
      if (c.x < -90) c.x = W + 80;
      if (c.x > W + 90) c.x = -80;
      var a = c.a * Math.max(0, 1 - Math.max(0, c.m - 1100) / 400);
      if (a <= .01) continue;
      ctx.globalAlpha = a;
      var w = 120 * c.s, h = 64 * c.s;
      ctx.drawImage(cloudImg(c.m < 350 ? 0 : c.m < 800 ? 1 : 2, c.sh), c.x - w / 2, y - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
  }

  // 夕方の空にただよう、ぼんやりした光の粒
  function drawBokeh() {
    var a = Math.max(0, Math.min(1, hm / 150)) * Math.max(0, 1 - Math.max(0, hm - 900) / 500);
    if (a <= .01) return;
    for (var i = 0; i < bokeh.length; i++) {
      var b = bokeh[i];
      var y = ((b.y - camY * .35) % (H * 2) + H * 2) % (H * 2) - H * .5;
      if (y < -30 || y > H + 30) continue;
      ctx.globalAlpha = a * (.6 + .4 * Math.sin(frame * .03 + b.ph));
      var sz = 28 * b.s;
      ctx.drawImage(bokehImg, b.x - sz / 2, y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  // 遠くを横切る飛行機（飾り）
  function stepPlanes() {
    if (hm > 250 && hm < 1300 && --planeT <= 0 && planes.length < 2) {
      var d = Math.random() < .5 ? 1 : -1;
      planes.push({ x: d > 0 ? -70 : W + 70, y: camY + rnd(H * .1, H * .6), vx: d * rnd(.9, 1.5), dir: d });
      planeT = rnd(500, 1100);
    }
    for (var i = planes.length - 1; i >= 0; i--) {
      planes[i].x += planes[i].vx;
      if (planes[i].x > W + 120 || planes[i].x < -120) planes.splice(i, 1);
    }
  }
  function drawPlanes() {
    for (var i = 0; i < planes.length; i++) {
      var p = planes[i], y = p.y - camY;
      if (y < -40 || y > H + 40) continue;
      ctx.save();
      ctx.globalAlpha = .55;
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x - p.dir * 8, y); ctx.lineTo(p.x - p.dir * 70, y + 1); ctx.stroke();
      ctx.fillStyle = '#e9eef5';
      ctx.beginPath();
      ctx.moveTo(p.x + p.dir * 9, y);
      ctx.lineTo(p.x - p.dir * 7, y - 2.5);
      ctx.lineTo(p.x - p.dir * 7, y + 2.5);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(p.x - p.dir * 4, y - 5, 2, 10);
      ctx.restore();
    }
  }

  // 近づいてくる宇宙ステーション
  function drawStationFar() {
    if (goalGot || hm < 1150 || hm >= GOAL_M) return;
    var p = Math.min(1, (hm - 1150) / 850);
    var s = .35 + p * 1.5;
    var x = W * .7, y = 84 + p * 16;
    ctx.save();
    ctx.globalAlpha = hm > 1940 ? Math.max(0, 1 - (hm - 1940) / 60) : .95;
    ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(frame * .004) * .12);
    ctx.fillStyle = '#20406e';
    ctx.fillRect(-40, -3, 80, 6);
    ctx.fillStyle = '#c8d6e6';
    ctx.fillRect(-13, -9, 26, 18);
    ctx.fillStyle = '#7fb2ff';
    ctx.fillRect(-40, -11, 22, 22);
    ctx.fillRect(18, -11, 22, 22);
    ctx.strokeStyle = 'rgba(20,40,80,.6)'; ctx.lineWidth = 1;
    for (var i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(-29 + i * 0, -11); ctx.lineTo(-29, 11); ctx.stroke();
    }
    ctx.restore();
  }

  // 出発地点の街: 遠いビル(ゆっくり動く)と近いビル、出発ビルの屋上
  function drawCity() {
    var gy = groundY - camY;
    var fy = groundY - camY * .55;
    if (fy - FAR_TOP < H + 10) {
      ctx.globalAlpha = .85;
      ctx.drawImage(farCityImg, 0, fy + 24 - FAR_TOP, W, FAR_TOP + 120);
      ctx.globalAlpha = 1;
    }
    if (gy > H + 260) return;
    ctx.drawImage(nearCityImg, 0, gy + 24 - CITY_TOP, W, CITY_TOP + 120);
    ctx.save();
    ctx.fillStyle = '#4a4166';
    ctx.fillRect(0, gy, W, 30);
    ctx.fillStyle = '#6a5e8e';
    ctx.fillRect(0, gy, W, 4);
    ctx.fillStyle = '#36304d';
    for (var k = 0; k < 5; k++) rr(10 + k * (W / 5), gy + 11, 22, 12, 3), ctx.fill();
    ctx.strokeStyle = '#8fa3bd'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W * .84, gy); ctx.lineTo(W * .84, gy - 34); ctx.stroke();
    ctx.fillStyle = (frame % 60 < 30) ? '#ff5a5a' : 'rgba(255,90,90,.25)';
    ctx.beginPath(); ctx.arc(W * .84, gy - 37, 3, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // ===== 足場 =====
  function mk(x, y, type, w) {
    return { x: x, y: y, w: Math.max(44, w), h: PH, type: type,
             dead: false, crack: false, dip: 0,
             ph: rnd(0, 6.28), dir: Math.random() < .5 ? 1 : -1, sp: rnd(.9, 2.3),
             fallT: 0, fv: 0 };
  }

  function spineType(m) {
    if (ticketActive && m >= 90) {
      var rb = Math.random();
      if (m >= 450 && rb < .22) return Math.random() < .5 ? TRAMPO : BOOST;
      if (m < 450 && rb < .16) return TRAMPO;
    }
    var r = Math.random();
    if (m < 90) return BEAM;
    if (m < 450) { if (r < .13) return GONDOLA; if (r < .23) return TRAMPO; if (r < .31) return CONVEYOR; return BEAM; }
    if (m < 1100) { if (r < .20) return GONDOLA; if (r < .31) return TRAMPO; if (r < .35) return BOOST; if (r < .45) return CONVEYOR; return BEAM; }
    if (r < .26) return GONDOLA;
    if (r < .37) return TRAMPO;
    if (r < .43) return BOOST;
    if (r < .55) return CONVEYOR;
    return BEAM;
  }
  function bonusType(m) {
    var r = Math.random();
    if (m < 300) return r < .35 ? CRUMBLE : GLASS;
    if (m < 900) { if (r < .34) return CLOUD; if (r < .6) return GLASS; return CRUMBLE; }
    if (r < .3) return HOLO;
    if (r < .52) return GLASS;
    if (r < .76) return CRUMBLE;
    return CLOUD;
  }
  function gap(m, y) {
    var d = Math.min(m / 1800, 1);
    var raw = (H / 8) * (.55 + Math.random() * .8) * (1 + d * .35);
    if (y < goalY) return Math.min(raw * 1.9, SAFE_GAP_LOW);
    return Math.min(raw, SAFE_GAP);
  }
  function wmul(m, t) {
    var lo, hi;
    if (m < 400) { lo = 1.0; hi = 1.5; }
    else if (m < 1200) { lo = .85; hi = 1.3; }
    else { lo = .72; hi = 1.15; }
    var v = lo + Math.random() * (hi - lo);
    if (t === TRAMPO || t === BOOST) v = Math.max(v, .95);
    return v;
  }

  function fillUpTo(topY) {
    var base = W * PW;
    while (genY > topY) {
      // 区切りのブロックは、直前の足場から届く間隔に置く
      if (genY - mileY <= (genY < goalY ? SAFE_GAP_LOW : SAFE_GAP)) {
        var st = mk(0, mileY, mileIdx === 0 ? STATION : MILE, W);
        st.h = 18; st.mi = mileIdx; plats.push(st);
        genY = mileY;
        mileIdx++; mileY = mToY(mileAt(mileIdx));
        continue;
      }
      var g = gap(yToM(genY), genY);
      var ny = genY - g;
      if (ny < mileY + 80) ny = mileY + 80;

      var m = yToM(ny), L = zoneLv(m), thin = 1 - .07 * L;
      var t = spineType(m);
      var w = base * wmul(m, t) * thin;
      var sp = mk(rnd(0, W - w), ny, t, w);
      sp.sp *= 1 + .15 * L;
      plats.push(sp);

      if (g > 54 && Math.random() < (m < 300 ? .25 : .52)) {
        var bt = m >= 300 && Math.random() < .2 ? UPDRAFT : bonusType(m);
        var bw = bt === UPDRAFT ? 56 : base * wmul(m, bt) * .88 * thin;
        plats.push(mk(rnd(0, W - bw), ny + g * (.35 + Math.random() * .3), bt, bw));
      }
      genY = ny;
    }
  }

  // 5000m 月面基地 / 10000m 星の港 / 20000m〜 銀河ゲート
  function drawMile(p, y) {
    var th = Math.min(p.mi, 3);
    var C = [null,
      { base: '#c9ccd6', top: '#eef0f5', mark: '#a3a8b8' },
      { base: '#26306e', top: '#ffd84a', mark: '#ffe89a' },
      { base: '#4b2f8f', top: '#c9a6ff', mark: '#e6d6ff' }][th];
    ctx.save();
    ctx.fillStyle = C.base; ctx.fillRect(0, y, W, p.h + 70);
    ctx.fillStyle = C.top; ctx.fillRect(0, y, W, 5);
    var i;
    if (th === 1) {
      ctx.fillStyle = C.mark;
      for (i = 0; i < 7; i++) {
        ctx.beginPath(); ctx.ellipse((i * 83) % (W - 30) + 15, y + 22 + (i % 3) * 14, 9 - (i % 3) * 2, 4, 0, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = 'rgba(180,220,255,.55)';
      ctx.beginPath(); ctx.arc(W * .8, y, 22, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#eef0f5'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W * .16, y); ctx.lineTo(W * .16, y - 30); ctx.stroke();
      ctx.fillStyle = '#e8403f'; ctx.fillRect(W * .16, y - 30, 16, 10);
    } else if (th === 2) {
      for (i = 0; i * 26 < W; i++) {
        var on = (frame + i * 7) % 40 < 20;
        ctx.fillStyle = on ? C.mark : 'rgba(255,232,154,.3)';
        ctx.beginPath(); ctx.arc(13 + i * 26, y + 14, 2.5, 0, 6.2832); ctx.fill();
      }
    } else {
      for (i = 0; i < RAINBOW.length; i++) {
        ctx.fillStyle = RAINBOW[i]; ctx.globalAlpha = .75;
        ctx.fillRect(0, y + 8 + i * 4, W, 4);
      }
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'center';
    ctx.font = '800 20px system-ui, sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 6;
    ctx.fillStyle = '#fff';
    ctx.fillText(mileAt(p.mi) + 'm  ' + mileName(p.mi), W / 2, y + 56);
    if (p.got) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = (frame % 50 < 25) ? '#7ee08a' : 'rgba(126,224,138,.3)';
      ctx.beginPath(); ctx.arc(W * .5, y - 8, 4, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function holoOn(p) { return (frame + ((p.ph * 31) | 0)) % 165 < 98; }

  // 足場の見た目の共通形: 角の丸い板に、上の照り・下の厚み・落ちる影。
  // 当たり判定は今までどおり上面 y・幅 w で、見た目だけ下に厚みを足している
  var SLAB_H = 12;
  function slab(x, y, w, top, side, line, r, h) {
    h = h || SLAB_H;
    ctx.fillStyle = 'rgba(30,15,60,.16)';
    ell(ctx, x + w / 2, y + h + 6, w * .44, 3); ctx.fill();
    rr(x, y, w, h + 4, r);
    ctx.fillStyle = side; ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 1.2; ctx.stroke();
    rr(x + .6, y + .6, w - 1.2, h - 1.2, Math.max(1, r - .6));
    ctx.fillStyle = top; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    rr(x + Math.min(6, w * .15), y + 2, w - Math.min(12, w * .3), 2.2, 1.1); ctx.fill();
  }
  // 上昇気流: 下の吹き出し口から、上へ流れる矢印の光の柱
  function drawUpdraft(p, y) {
    var x = p.x, w = p.w, top = y - UPDRAFT_H, i;
    ctx.save();
    var g = ctx.createLinearGradient(0, top, 0, y);
    g.addColorStop(0, 'rgba(160,255,240,0)'); g.addColorStop(.6, 'rgba(160,255,240,.16)'); g.addColorStop(1, 'rgba(160,255,240,.3)');
    ctx.fillStyle = g; rr(x, top, w, UPDRAFT_H, w / 2); ctx.fill();
    ctx.strokeStyle = 'rgba(225,255,250,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (i = 0; i < 4; i++) {
      var d = (frame * 2.2 + i * UPDRAFT_H / 4 + p.ph * 20) % UPDRAFT_H;
      ctx.globalAlpha = Math.sin(d / UPDRAFT_H * Math.PI);
      var ay = y - d;
      ctx.beginPath(); ctx.moveTo(x + w / 2 - 7, ay + 5); ctx.lineTo(x + w / 2, ay); ctx.lineTo(x + w / 2 + 7, ay + 5); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#5fcfc0'; rr(x + 6, y - 2, w - 12, 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; rr(x + 10, y - 1, w - 20, 1.6, .8); ctx.fill();
    ctx.restore();
  }
  function drawPlat(p) {
    var y = p.y - camY;
    if (p.type === UPDRAFT) { if (!p.dead && y > -10 && y - UPDRAFT_H < H) drawUpdraft(p, y); return; }
    if (p.dead || y < -60 || y > H + 80) return;
    if (p.ground) return;
    var x = p.x;
    if (p.type === GLASS && p.crack) { x += rnd(-1.5, 1.5); y += rnd(-1, 1); }

    if (p.type === MILE) { drawMile(p, y); return; }

    // 宇宙ステーション（ゴール足場）
    if (p.type === STATION) {
      ctx.save();
      ctx.fillStyle = '#b9c7d9'; ctx.fillRect(0, y, W, p.h + 70);
      ctx.fillStyle = '#dde6f0'; ctx.fillRect(0, y, W, 5);
      ctx.fillStyle = '#8fa2b8';
      for (var i = 0; i < 6; i++) ctx.fillRect((i * 97) % (W - 30) + 8, y + 22, 26, 10);
      // ソーラーパネル
      ctx.fillStyle = '#2f6fbf';
      ctx.fillRect(W * .06, y + 40, W * .34, 22);
      ctx.fillRect(W * .6, y + 40, W * .34, 22);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      for (var s2 = 0; s2 < 7; s2++) {
        var sx = W * .06 + (W * .34) * s2 / 7;
        ctx.beginPath(); ctx.moveTo(sx, y + 40); ctx.lineTo(sx, y + 62); ctx.stroke();
        var sx2 = W * .6 + (W * .34) * s2 / 7;
        ctx.beginPath(); ctx.moveTo(sx2, y + 40); ctx.lineTo(sx2, y + 62); ctx.stroke();
      }
      if (p.got) {
        ctx.fillStyle = (frame % 50 < 25) ? '#7ee08a' : 'rgba(126,224,138,.3)';
        ctx.beginPath(); ctx.arc(W * .5, y - 8, 4, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
      return;
    }

    // 沈む雲(消えないが、乗ると沈んで低くしか跳べない): わたぐもと同じもこもこの描き方
    if (p.type === CLOUD) {
      ctx.save();
      var ccx = x + p.w / 2, ccy = y + 5 + p.dip * 6, crx = p.w * .42 * (1 + p.dip * .08), cry = 7 * (1 - p.dip * .25);
      cloudPath(ctx, ccx, ccy, crx, cry);
      ctx.strokeStyle = '#c7c0e8'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.fillStyle = 'rgba(214,208,245,.7)';
      ell(ctx, ccx, ccy + cry * .7, crx * .8, cry * .35); ctx.fill();
      ctx.restore();
      return;
    }

    // ホログラム足場（点滅）
    if (p.type === HOLO) {
      ctx.save();
      if (!holoOn(p)) {
        ctx.globalAlpha = .3; ctx.strokeStyle = '#3dd6f5'; ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 5]);
        rr(x, y, p.w, SLAB_H, SLAB_H / 2); ctx.stroke();
        ctx.restore(); return;
      }
      var cnt = (frame + ((p.ph * 31) | 0)) % 165;
      if (cnt > 80 && cnt % 6 < 3) ctx.globalAlpha = .45;
      ctx.shadowColor = 'rgba(61,214,245,.8)'; ctx.shadowBlur = 8;
      rr(x, y, p.w, SLAB_H, SLAB_H / 2);
      ctx.fillStyle = 'rgba(61,214,245,.35)'; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#8ff0ff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
      for (var ly = y + 3; ly < y + SLAB_H - 1; ly += 3) {
        ctx.beginPath(); ctx.moveTo(x + 5, ly); ctx.lineTo(x + p.w - 5, ly); ctx.stroke();
      }
      ctx.restore();
      return;
    }

    ctx.save();
    var cx0 = x + p.w / 2, i;

    // ベルトコンベア（乗ると横に流される）
    if (p.type === CONVEYOR) {
      slab(x, y, p.w, '#6b7896', '#3c4560', '#2c3348', SLAB_H / 2);
      ctx.save();
      rr(x + 6, y + 1, p.w - 12, SLAB_H - 4, 3); ctx.clip();
      ctx.fillStyle = '#ffd36b';
      var off = (frame * p.dir * 1.6) % 12;
      for (var cxp = -12; cxp < p.w + 12; cxp += 12) {
        var ax = x + cxp + off;
        ctx.beginPath();
        ctx.moveTo(ax - 2.5 * p.dir, y + 2); ctx.lineTo(ax + 2.5 * p.dir, y + 5.5); ctx.lineTo(ax - 2.5 * p.dir, y + 9);
        ctx.lineTo(ax - 5 * p.dir, y + 9); ctx.lineTo(ax, y + 5.5); ctx.lineTo(ax - 5 * p.dir, y + 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = '#c3cde0';
      for (i = 0; i < 2; i++) {
        var rx0 = i ? x + p.w - 6 : x + 6;
        ctx.beginPath(); ctx.arc(rx0, y + 6, 4, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#6b7896'; ctx.beginPath(); ctx.arc(rx0, y + 6, 1.5, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#c3cde0';
      }
      ctx.restore(); return;
    }

    // 崩れる足場（乗るとしばらくして落ちる）: クッキー
    if (p.type === CRUMBLE) {
      var sh2 = p.fallT > 0 && p.fallT <= 18 ? rnd(-1.5, 1.5) : 0;
      slab(x + sh2, y, p.w, '#f5cf93', '#c98a4b', '#a86c34', 5);
      ctx.fillStyle = 'rgba(140,85,40,.7)';
      for (i = 0; i < p.w / 12; i++) {
        ctx.beginPath(); ctx.arc(x + sh2 + 7 + i * 12 + (i % 2) * 3, y + 4 + (i % 2) * 3, 1.3, 0, 6.2832); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(120,70,30,.55)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + sh2 + p.w * .36, y); ctx.lineTo(x + sh2 + p.w * .4, y + 6); ctx.lineTo(x + sh2 + p.w * .34, y + SLAB_H + 2);
      ctx.moveTo(x + sh2 + p.w * .7, y); ctx.lineTo(x + sh2 + p.w * .66, y + 7); ctx.lineTo(x + sh2 + p.w * .7, y + SLAB_H + 2);
      ctx.stroke();
      ctx.restore(); return;
    }

    // ゴンドラ（左右に動く）
    if (p.type === GONDOLA) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + 8, y); ctx.lineTo(x + 8, y - 44);
      ctx.moveTo(x + p.w - 8, y); ctx.lineTo(x + p.w - 8, y - 44);
      ctx.stroke();
      slab(x, y, p.w, '#ffe27a', '#e0a53a', '#c48a24', SLAB_H / 2);
      ctx.fillStyle = 'rgba(160,100,20,.55)';
      for (i = -1; i <= 1; i += 2) {
        var tx = cx0 + i * 7;
        ctx.beginPath(); ctx.moveTo(tx + i * 3.5, y + 5); ctx.lineTo(tx - i * 1.5, y + 2); ctx.lineTo(tx - i * 1.5, y + 8); ctx.closePath(); ctx.fill();
      }
      ctx.restore(); return;
    }

    // トランポリン（大ジャンプ）: ばね2本の上に、たわむ膜
    if (p.type === TRAMPO) {
      var bend = 3 + Math.sin(frame * .1 + p.ph) * 1.5;
      ctx.strokeStyle = '#d65a8e'; ctx.lineWidth = 1.6;
      for (i = 0; i < 2; i++) {
        var sx = i ? x + p.w - 9 : x + 9;
        for (var k = 0; k < 3; k++) { ell(ctx, sx, y + 8 + k * 3, 4, 1.3); ctx.stroke(); }
      }
      slab(x, y + 14, p.w, '#ffc6dc', '#d65a8e', '#b0406f', 4, 6);
      ctx.strokeStyle = '#ff6fa8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 3);
      ctx.quadraticCurveTo(cx0, y + 3 + bend * 2, x + p.w - 4, y + 3);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 2);
      ctx.quadraticCurveTo(cx0, y + 1 + bend * 2, x + p.w - 8, y + 2);
      ctx.stroke();
      ctx.restore(); return;
    }

    // ロケット床（超大ジャンプ）: 台の上に小さなロケット
    if (p.type === BOOST) {
      slab(x, y, p.w, '#ffc38a', '#e0772e', '#b85a1c', SLAB_H / 2);
      var f = 4 + Math.abs(Math.sin(frame * .3)) * 5;
      ctx.fillStyle = '#ffd36b';
      ctx.beginPath(); ctx.moveTo(cx0 - 4, y - 3); ctx.lineTo(cx0, y - 3 + f); ctx.lineTo(cx0 + 4, y - 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c9d3e6'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx0, y - 26);
      ctx.quadraticCurveTo(cx0 + 7, y - 18, cx0 + 6, y - 5);
      ctx.lineTo(cx0 - 6, y - 5);
      ctx.quadraticCurveTo(cx0 - 7, y - 18, cx0, y - 26);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff5a5a';
      ctx.beginPath(); ctx.moveTo(cx0, y - 26); ctx.quadraticCurveTo(cx0 + 4, y - 23, cx0 + 5, y - 20); ctx.lineTo(cx0 - 5, y - 20); ctx.quadraticCurveTo(cx0 - 4, y - 23, cx0, y - 26); ctx.fill();

      ctx.beginPath(); ctx.arc(cx0, y - 14, 2.4, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#ff5a5a';
      ctx.beginPath(); ctx.moveTo(cx0 - 6, y - 10); ctx.lineTo(cx0 - 9, y - 4); ctx.lineTo(cx0 - 5, y - 5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx0 + 6, y - 10); ctx.lineTo(cx0 + 9, y - 4); ctx.lineTo(cx0 + 5, y - 5); ctx.fill();

    if (p.type === GLASS) {

      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.4;

  // ===== プレイヤー =====
  // 4体とも「足もと by」を基準に描き、体の中心の高さを返す。s は体の半径15pxを1とした倍率
  var INK = '#2a2433';
  function ell(g, x, y, rx, ry, rot) {
    g.beginPath();

  function gloss(g, x, y, s) {

  }
  // 顔は 通常 / ジャンプ(口を開ける) / 着地(>< の目) の3つ
  function drawFace(g, x, y, s, st, brows) {
    var ex = 5 * s;

      g.moveTo(x + ex + 1.8 * s, y - 2 * s); g.lineTo(x + ex - 1.6 * s, y); g.lineTo(x + ex + 1.8 * s, y + 2 * s);
      g.stroke();

  // バネうさぎ: 長い耳と、ばねの足。着地で縮み、跳ぶと伸びる
  function drawUsagi(g, cx, by, rx, ry, st, t, P) {
    var s = (rx + ry) / 30;

    g.strokeStyle = P.spring; g.lineWidth = 1.5 * s;

    }
    for (var e = -1; e <= 1; e += 2) {
      g.save();

      ell(g, 0, -8.5 * s, 4 * s, 10 * s); g.fill(); g.stroke();
      g.fillStyle = P.inner;

  // わたぐも: もこもこの雲に虹。ふちを先に太く引き、上から白で塗ると外側だけが縁になる
  var PUFFS = [[0, 0, .95], [-.6, .22, .6], [.6, .22, .6], [-.35, -.45, .58], [.32, -.5, .62], [-.95, .3, .42], [.95, .32, .42], [0, .45, .7]];
  var RAINBOW = ['#ff6b6b', '#ffb14d', '#ffe45a', '#6ee07a', '#4ec8f0', '#9b7bff'];
  function cloudPath(g, cx, cy, rx, ry, shape) {
    var P = shape || PUFFS;
    g.beginPath();
    for (var i = 0; i < P.length; i++) {
      var p = P[i], x = cx + p[0] * rx, y = cy + p[1] * ry;
      g.moveTo(x + p[2] * rx, y);
      g.ellipse(x, y, p[2] * rx, p[2] * ry, 0, 0, 6.2832);
    }

  function drawKumo(g, cx, by, rx, ry, st, t, P) {

  // たまご忍者: たまご形に緑のはちまきと帯。結び目の尾がなびく

    ell(g, cx + 5 * s, by - 1.5 * s, 3 * s, 2 * s); g.fill();

  // スターキング: 星の体に王冠・白い羽・赤いマント。まわりにきらめき
  function starPath(g, cx, cy, R, k, inner) {
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = Math.PI / 5 * i - Math.PI / 2, r = i % 2 ? R * inner : R;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * k;

  function twinkle(g, x, y, r, a) {

    g.fill();

  function drawKing(g, cx, by, rx, ry, st, t, P) {

    g.translate(cx, cy - R * k * .62);

    g.scale(1.15, 1.15);

  var DRAW = { usagi: drawUsagi, kumo: drawKumo, ninja: drawNinja, king: drawKing };
  function drawChar(g, key, cx, by, rx, ry, st, t, P) { return DRAW[key](g, cx, by, rx, ry, st, t, P); }

  function newPlayer() {
    return { x: W / 2 - 15, y: groundY - 26, w: 30, h: 26, vy: JMP, kx: 0, sq: 0, landT: 0 };
  }

  function drawPlayer() {
    var v = Math.max(-1, Math.min(1, pl.vy / 13));
    var stretch = pl.vy < 0 ? -v * .22 : v * .10;
    var R = pl.w * .5;
    var wob = Math.sin(frame * .18) * (.8 + pl.sq * 2.2);
    var rx = R * (1 + pl.sq * .30 - stretch * .45) + wob;
    var ry = R * (1 - pl.sq * .26 + stretch) - wob;
    var cx = pl.x + pl.w / 2, by = pl.y - camY + pl.h;
    var st = pl.landT > 0 ? 'land' : (pl.vy < -3 ? 'jump' : 'normal');

    ctx.save();
    if (invuln > 0 && (invuln >> 2) % 2 === 0) ctx.globalAlpha = .45;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ell(ctx, cx, by + 2, rx * .85, 3); ctx.fill();
    var cy = drawChar(ctx, CH.key, cx, by, rx, ry, st, frame, skinOf(CH.key));

    if (hm >= 1400) {
      var hr = Math.max(rx, ry) * 1.32;
      ctx.strokeStyle = 'rgba(200,235,255,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, hr, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, hr, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
    }

  }

  // ===== 粒 =====
  function burst(x, y, c, n) {
    for (var i = 0; i < n; i++) {
      parts.push({ x: x, y: y, vx: rnd(-2, 2), vy: rnd(-3.5, .5), life: 1, c: c, r: rnd(1, 3.5) });
    }
  }
  function confetti(x, y) {
    var cs = ['#ff9a3d', '#3dd6f5', '#7ee08a', '#ffe08a', '#fff'];
    for (var i = 0; i < 46; i++) {
      parts.push({ x: x + rnd(-W * .4, W * .4), y: y + rnd(-25, 25),
                   vx: rnd(-1.6, 1.6), vy: rnd(-4.5, -1), life: 1.5,
                   c: cs[i % cs.length], r: rnd(1.5, 4) });
    }
  }
  function stepParts() {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .06; p.life -= .028;
      if (p.life <= 0) parts.splice(i, 1);
    }

  function heartPath(g, x, y, r) {
    g.beginPath();

  // 跳んだ跡
  function trailPart(kind) {
    parts.push({ x: pl.x + pl.w / 2 + rnd(-8, 8), y: pl.y + pl.h * .6, vx: rnd(-.5, .5), vy: rnd(.3, 1.1),
      life: .9, r: rnd(2.2, 3.4), sh: kind, rot: rnd(0, 6.28),
      c: kind === 'rainbow' ? 'hsl(' + ((frame * 6) % 360) + ',95%,65%)'
        : kind === 'heart' ? '#ff6b8a' : kind === 'sakura' ? '#ffb7cc' : '#fff6b0' });
  }
  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], y = p.y - camY;
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.sh === 'star') { twinkle(ctx, p.x, y, p.r * .7, 1); continue; }
      ctx.fillStyle = p.c;

  }

  // ===== じゃまもの =====
  function knock(dx, down) {
    if (invuln > 0 || rocketOn) return;
    if (CH.tough) {
      invuln = 45;
      pl.kx = dx * 1.1;
      burst(pl.x + pl.w / 2, pl.y + pl.h / 2, '#ffffff', 10);
      return;
    }
    invuln = 85;
    pl.vy = Math.max(pl.vy, down || 2.6);
    pl.kx = dx * 3.6;
    burst(pl.x + pl.w / 2, pl.y + pl.h / 2, '#dbe6f2', 8);
  }
  function countFoe(k) {
    var n = 0;
    for (var i = 0; i < foes.length; i++) if (foes[i].k === k) n++;
    return n;
  }
  function stepFoes() {
    if (cheer <= 0) {
      if (hm > 240 && hm < 1500 && --droneT <= 0) {
        if (countFoe('drone') < 2) {
          var d = Math.random() < .5 ? 1 : -1;
          foes.push({ k: 'drone', st: 'warn', t: 55, dir: d, x: d > 0 ? -34 : W + 34,
                      oy: H * rnd(.12, .5), y: 0, vx: d * rnd(2.1, 3.3), bob: rnd(0, 6.28) });
        }
        droneT = rnd(200, 420);
      }
      if (hm > 950 && --debrisT <= 0) {
        if (countFoe('debris') < Math.min(3 + lv, 6)) {
          var y0 = camY - 50, x0 = rnd(0, W), vy = rnd(5.5, 8);
          var tx2 = pl.x + pl.w / 2 + rnd(-90, 90);
          var fr = Math.max((pl.y - y0) / vy, 1);
          foes.push({ k: 'debris', st: 'warn', t: 62, x: x0, oy: -50, y: y0,
                      vx: Math.max(-4.5, Math.min(4.5, (tx2 - x0) / fr)), vy: vy,
                      rot: rnd(0, 6.28), rv: rnd(-.12, .12) });
        }
        debrisT = rnd(170, 330) / (1 + .25 * lv);
      }
    }
    for (var i = foes.length - 1; i >= 0; i--) {
      var f = foes[i];
      if (f.st === 'warn') {
        f.y = camY + f.oy;
        if (--f.t <= 0) f.st = 'go';
        continue;
      }
      if (f.k === 'drone') {
        f.x += f.vx; f.bob += .2;
        var my = f.y + Math.sin(f.bob) * 10;
        if (invuln <= 0 && pl.x + pl.w > f.x - 15 && pl.x < f.x + 15 &&
            pl.y + pl.h > my - 10 && pl.y < my + 10) knock(f.dir);
        if (f.x > W + 60 || f.x < -60) foes.splice(i, 1);
      } else {
        f.x += f.vx; f.y += f.vy; f.rot += f.rv;
        if (frame % 2 === 0) {
          parts.push({ x: f.x - f.vx, y: f.y - f.vy, vx: rnd(-.8, .8), vy: rnd(-.8, .8),
                       life: .5, c: Math.random() < .5 ? '#ff9a3d' : '#ffe08a', r: rnd(1, 3) });
        }
        var dx = f.x - (pl.x + pl.w / 2), dy = f.y - (pl.y + pl.h / 2);
        if (invuln <= 0 && dx * dx + dy * dy < 24 * 24) knock(f.vx >= 0 ? 1 : -1);
        if (f.y > camY + H + 70) foes.splice(i, 1);
      }
    }
  }
  function edgeWarn(dir, sy) {
    var x = dir > 0 ? 15 : W - 15;
    var y = Math.max(26, Math.min(H - 14, sy));
    ctx.save();
    ctx.globalAlpha = .35 + .6 * Math.abs(Math.sin(frame * .2));
    ctx.fillStyle = '#ff5a5a'; ctx.font = '800 18px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', x, y);
    ctx.restore();
  }
  function drawFoes() {
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i];
      if (f.k === 'drone') {
        if (f.st === 'warn') { edgeWarn(f.dir, f.y - camY); continue; }
        var y = f.y + Math.sin(f.bob) * 10 - camY;
        if (y < -30 || y > H + 30) continue;
        ctx.save();
        // アーム
        ctx.strokeStyle = '#3c465a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(f.x - 11, y - 4); ctx.lineTo(f.x + 11, y + 2);
        ctx.moveTo(f.x + 11, y - 4); ctx.lineTo(f.x - 11, y + 2);
        ctx.stroke();
        // ローター
        ctx.strokeStyle = 'rgba(200,220,240,.55)'; ctx.lineWidth = 1.5;
        var spin = (frame % 6 < 3) ? 8 : 4;
        for (var q = 0; q < 4; q++) {
          var rx = f.x + (q % 2 ? 11 : -11), ry = y + (q < 2 ? -4 : 2);
          ctx.beginPath(); ctx.ellipse(rx, ry, spin, 2, 0, 0, 6.2832); ctx.stroke();
        }
        // 本体
        ctx.fillStyle = '#2b3446';
        rr(f.x - 9, y - 4, 18, 9, 3); ctx.fill();
        ctx.fillStyle = (frame % 40 < 20) ? '#ff5a5a' : '#3dd6f5';
        ctx.beginPath(); ctx.arc(f.x + f.dir * 6, y, 2, 0, 6.2832); ctx.fill();
        // カメラ
        ctx.fillStyle = '#4a5468';
        ctx.beginPath(); ctx.arc(f.x, y + 6, 3.5, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else {
        var ey = f.y - camY;
        if (f.st === 'warn') {
          var len = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
          ctx.save();
          ctx.globalAlpha = .25 + .45 * Math.abs(Math.sin(frame * .15));
          ctx.strokeStyle = '#ff7a4d'; ctx.lineWidth = 2; ctx.setLineDash([5, 8]);
          ctx.beginPath(); ctx.moveTo(f.x, ey);
          ctx.lineTo(f.x + (f.vx / len) * H * 1.6, ey + (f.vy / len) * H * 1.6);
          ctx.stroke(); ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(f.x, Math.max(ey, 14), 6, 0, 6.2832);
          ctx.fillStyle = '#ff7a4d'; ctx.fill();
          ctx.restore();
          continue;
        }
        if (ey < -40 || ey > H + 40) continue;
        ctx.save();
        ctx.translate(f.x, ey); ctx.rotate(f.rot);
        ctx.fillStyle = '#7a8496';
        ctx.beginPath();
        for (var v = 0; v < 7; v++) {
          var a = (6.2832 / 7) * v, rr3 = 11 * (.75 + ((v * 37) % 10) / 28);
          if (v === 0) ctx.moveTo(Math.cos(a) * rr3, Math.sin(a) * rr3);
          else ctx.lineTo(Math.cos(a) * rr3, Math.sin(a) * rr3);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#5a6476';
        ctx.beginPath(); ctx.arc(-3, -2, 3, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    }
  }

  // ===== ビル風 =====
  function stepWind() {
    if (hm < 200) { wind = 0; windTo = 0; return; }
    if (--windT <= 0) {
      if (Math.abs(windTo) > .05) { windTo = 0; windT = rnd(240, 460); }
      else { windTo = (Math.random() < .5 ? -1 : 1) * rnd(.5, 1.05) * (1 + .1 * lv); windT = rnd(220, 380); }
    }
    wind += (windTo - wind) * .02;
  }
  function drawWind() {
    if (Math.abs(wind) < .12) return;
    var n = Math.min(1, Math.abs(wind) / 1.05);
    ctx.save();
    ctx.globalAlpha = .25 + n * .35;
    ctx.strokeStyle = '#dceaff'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    for (var i = 0; i < 5; i++) {
      var y = 46 + i * 9;
      var off = ((frame * wind * 2.4) % (W + 90)) - 45;
      var len = 16 + i * 6 * n;
      var x = ((off + i * 57) % (W + 90) + (W + 90)) % (W + 90) - 45;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * (wind < 0 ? -1 : 1), y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCheer() {
    if (cheer <= 0) return;
    var a = Math.min(1, cheer / 30, (200 - cheer) / 20);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#fff';
    ctx.font = '800 24px system-ui, sans-serif';
    var L = zoneLv(mileAt(cheerMi));
    ctx.fillText(cheerMi === 0 ? 'ドッキング成功' : mileAt(cheerMi) + 'm 到達！', W / 2, H * .27);
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText(cheerMi === 0 ? 'ここから低重力ゾーン'
      : mileName(cheerMi) + '・ここから むずかしさ Lv' + L + (L >= MAX_LV ? '(最大)' : ''), W / 2, H * .27 + 24);
    ctx.restore();
  }

  function drawToast() {
    if (toastT <= 0) return;
    var a = Math.min(1, toastT / 20, (150 - toastT) / 15);
    var txt = toastText;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = '800 15px system-ui, sans-serif';
    var tw = ctx.measureText(txt).width + 28, y = H * .17;
    ctx.fillStyle = 'rgba(10,14,40,.7)';
    rr(W / 2 - tw / 2, y - 18, tw, 34, 17); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.textAlign = 'center';
    ctx.fillText(txt, W / 2, y + 5);
    ctx.restore();
  }

  // ===== ループ =====
  function step() {
    if (invuln > 0) invuln--;
    if (cheer > 0) {
      cheer--;
      if (cheer > 50 && cheer % 26 === 0) confetti(W / 2, camY + 70);
    }
    hm = Math.max(0, yToM(pl.y));
    lv = zoneLv(hm);
    if (toastT > 0) toastT--;
    else if (toastQ.length) { toastText = toastQ.shift(); toastT = 150; }
    stepWind();

    var mv = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) mv = -CH.speed;
    if (keys['ArrowRight'] || keys['KeyD']) mv = CH.speed;
    if (touchX !== null) {
      var c = pl.x + pl.w / 2;
      if (touchX < c - 8) mv = -CH.speed;
      else if (touchX > c + 8) mv = CH.speed;
    }
    pl.x += mv + wind * 1.9 * CH.wind;

    if (pl.kx !== 0) {
      pl.x += pl.kx; pl.kx *= .88;
      if (Math.abs(pl.kx) < .1) pl.kx = 0;
    }
    if (pl.x + pl.w < 0) pl.x = W;
    if (pl.x > W) pl.x = -pl.w;

    pl.vy += (pl.y < goalY ? LOWG : G) * CH.grav;
    for (var u = 0; u < plats.length; u++) {
      var ud = plats[u];
      if (ud.type !== UPDRAFT) continue;
      var pcx = pl.x + pl.w / 2, pb = pl.y + pl.h;
      if (pcx > ud.x && pcx < ud.x + ud.w && pb < ud.y + 6 && pb > ud.y - UPDRAFT_H) {
        // 速く落ちてきても柱の中で止まれる強さ(速さ10なら約77pxで上向きに変わる)
        pl.vy = Math.max(pl.vy - (pl.y < goalY ? .55 : 1.0), -11);
        if (frame % 3 === 0) burst(pcx, pb, 'rgba(190,255,245,.9)', 1);
      }
    }
    if (rocketOn) {
      pl.vy = -38;
      burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffb14d', 2);
      if (hm >= ROCKET_M) { rocketOn = false; pl.vy = JMP; }
    }
    pl.y += pl.vy;
    pl.sq *= .85;
    if (pl.vy < -17) burst(pl.x + pl.w / 2, pl.y + pl.h, '#ff9a3d', 1);
    if (pl.landT > 0) pl.landT--;
    if (equip.trail !== 'none') { if (frame % 2 === 0) trailPart(equip.trail); }
    else if (CH.key === 'king' && frame % 3 === 0) {
      parts.push({ x: pl.x + pl.w / 2 + rnd(-8, 8), y: pl.y + pl.h * .5,
                   vx: rnd(-.4, .4), vy: rnd(.2, 1), life: .7, c: '#ffe27a', r: rnd(1.2, 2.4) });
    }

    if (pl.vy > 0) {
      for (var i = 0; i < plats.length; i++) {
        var p = plats[i];
        if (p.dead) continue;
        if (p.type === HOLO && !holoOn(p)) continue;
        if (p.type === UPDRAFT) continue;
        if (p.type === CRUMBLE && p.fallT > 18) continue;
        var foot = pl.y + pl.h, prev = foot - pl.vy;
        if (pl.x + pl.w > p.x && pl.x < p.x + p.w && foot >= p.y && prev <= p.y) {
          if (p.type === GLASS && p.crack) {
            p.dead = true;
            burst(p.x + p.w / 2, p.y, '#cfe6f7', 10);
            continue;
          }
          pl.y = p.y - pl.h;
          pl.sq = .55;
          pl.landT = 9;
          if (p.type === TRAMPO) { pl.vy = TF; pl.sq = .85; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ff8fbd', 7); }
          else if (p.type === BOOST) { pl.vy = BF; pl.sq = .9; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffe08a', 14); }
          else if (p.type === GLASS) { p.crack = true; pl.vy = JMP; burst(pl.x + pl.w / 2, pl.y + pl.h, '#cfe6f7', 4); }
          else if (p.type === CLOUD) { p.dip = 1; pl.vy = JMP * .6; pl.sq = .8; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffffff', 6); }
          else if (p.type === CONVEYOR) { pl.vy = JMP; pl.kx = p.dir * 4.2; burst(pl.x + pl.w / 2, pl.y + pl.h, '#ffc861', 4); }
          else if (p.type === CRUMBLE) { if (p.fallT === 0) p.fallT = 1; pl.vy = JMP; burst(pl.x + pl.w / 2, pl.y + pl.h, '#c8a87a', 5); }
          else if (p.type === STATION || p.type === MILE) {
            pl.vy = JMP;
            if (!p.got) {
              p.got = true; cheer = 200; cheerMi = p.mi; topMile = p.mi;
              confetti(W / 2, p.y - 50);
              if (p.type === STATION) goalGot = true;
            }
          } else { pl.vy = JMP; }
        }
      }
    }

    for (var j = 0; j < plats.length; j++) {
      var q = plats[j];
      if (q.dead) continue;
      if (q.type === GONDOLA) {
        q.x += q.dir * q.sp;
        if (q.x < 0 || q.x + q.w > W) q.dir *= -1;
      } else if (q.type === CLOUD && q.dip > 0) {
        q.dip = Math.max(0, q.dip - .05);
      } else if (q.type === CRUMBLE && q.fallT > 0) {
        q.fallT++;
        if (q.fallT > 18) { q.fv += .45; q.y += q.fv; }
        if (q.y > camY + H + 100) q.dead = true;
      }
    }

    stepFoes();
    stepPlanes();

    var want = pl.y - H * .38;
    if (want < camY) camY += (want - camY) * .11;
    var cap = pl.y - H * .14;
    if (cap < camY) camY = cap;

    var cur = Math.floor(hm);
    if (cur > score) { score = cur; elM.textContent = score; checkTitles(); }

    fillUpTo(camY - 120);
    for (var k = plats.length - 1; k >= 0; k--) {
      if (plats[k].y > camY + H + 140) plats.splice(k, 1);
    }
    stepParts();

    if (pl.y - camY > H + 60) { if (rescueArmed) rescue(); else over(); }
  }

  function paint() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawSun();
    drawStars();
    drawStationFar();
    drawPlanes();
    drawBokeh();
    drawClouds();
    drawCity();
    for (var i = 0; i < plats.length; i++) drawPlat(plats[i]);
    drawFoes();
    drawParts();
    drawPlayer();
    drawWind();
    drawCheer();
    drawToast();
  }

  // 調整値はすべて 60fps の1ステップ前提。描画の速さに関係なく実時間で 60 ステップ/秒 進める
  var STEP_MS = 1000 / 60, MAX_STEPS = 6;
  var acc = 0, lastT = 0;
  function kick() {
    acc = 0; lastT = performance.now();
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }
  function loop(now) {
    if (!run) return;
    var d = now - lastT;
    lastT = now;
    if (d < 0) d = 0;
    if (d > MAX_STEPS * STEP_MS) d = MAX_STEPS * STEP_MS;
    acc += d;
    while (acc >= STEP_MS && run) {
      frame++;
      step();
      acc -= STEP_MS;
    }
    paint();
    if (run) raf = requestAnimationFrame(loop);
  }

  // ===== 進行 =====
  function start() {
    // 使う品は開始時に1つ減らしてチェックを外す(「もう一度」で勝手に減らない)。救出ばねは助かった時だけ減る
    ticketActive = false; rocketOn = false;
    if (useSel.ticket && stock.ticket > 0) { stock.ticket--; ticketActive = true; useSel.ticket = false; }
    rocketUsed = false;
    if (useSel.rocket && stock.rocket > 0) { stock.rocket--; rocketOn = rocketUsed = true; useSel.rocket = false; }
    rescueArmed = !!useSel.rescue && stock.rescue > 0;
    saveStock();
    renderItemToggles();
    fit(); initBg();
    score = 0; camY = 0; frame = 0; hm = 0; invuln = 0;
    parts = []; foes = []; plats = [];
    droneT = 260; debrisT = 300; planeT = 180;
    wind = 0; windTo = 0; windT = 260;
    goalGot = false; cheer = 0; cheerMi = 0; topMile = -1; lv = 0;
    runTitles = []; runUnlocks = []; toastQ = []; toastT = 0;
    elM.textContent = '0';
    groundY = H - 30;
    goalY = mToY(GOAL_M);
    mileIdx = 0; mileY = goalY;
    var g = mk(0, groundY, BEAM, W);
    g.h = 30; g.ground = true;
    plats.push(g);
    genY = groundY;
    fillUpTo(-H * .6);
    pl = newPlayer();
    vStart.classList.remove('on');
    vOver.classList.remove('on');
    paused = false;
    vPause.classList.remove('on');
    bPause.classList.add('show');
    run = true;
    kick();
  }

  // 救出ばね: 画面の下に大きなばねを出して、ロケット床の勢いで打ち上げる
  function rescue() {
    rescueArmed = false;
    stock.rescue--; saveStock();
    if (stock.rescue <= 0) useSel.rescue = false;
    var y = camY + H - 40;
    plats.push(mk(pl.x + pl.w / 2 - 50, y, TRAMPO, 100));
    pl.y = y - pl.h; pl.vy = BF; pl.kx = 0; pl.sq = .9; pl.landT = 9;
    invuln = 90;
    burst(pl.x + pl.w / 2, y, '#ff8fbd', 16);
    toastQ.unshift('🌀 救出ばね！'); toastT = 0;
  }

  function over() {
    run = false;
    bPause.classList.remove('show');
    saveBest();
    var got = runCoins();
    if (got > 0) addCoins(got);
    elOM.textContent = score;
    $('oCoin').textContent = got > 0 ? ('+' + got + ' コイン' + (CH.coin ? '(' + CH.coin + '倍)' : '')) : '';
    var news = runUnlocks.map(function (n) { return n + 'が仲間になった！'; });
    if (runTitles.length) news.push('称号「' + runTitles.join('」「') + '」を手に入れた！');
    elNote.textContent = news.length ? news.join(' ')
      : topMile >= 0 ? mileName(topMile) + '(' + mileAt(topMile) + 'm)に到達'
      : (score >= best && score > 0 ? 'ベスト更新' : 'ベストまで あと ' + Math.max(1, best - score) + 'm');
    vOver.classList.add('on');
  }

  function pause() {
    if (!run) return;
    run = false; paused = true;
    if (raf) cancelAnimationFrame(raf);
    touchX = null; keys = {};
    vPause.classList.add('on');
  }
  function resume() {
    if (!paused) return;
    paused = false;
    vPause.classList.remove('on');
    run = true;
    kick();
  }
  function quitToTitle() {
    paused = false; run = false;
    if (raf) cancelAnimationFrame(raf);
    saveBest();
    if (runCoins() > 0) addCoins(runCoins());
    vPause.classList.remove('on');
    bPause.classList.remove('show');
    vOver.classList.remove('on');
    vStart.classList.add('on');
    buildPicker();
    title();
  }

  // ===== 操作 =====
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
  window.addEventListener('pagehide', pause);
  document.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (run) pause();
      else if (paused) resume();
    }
  });
  document.addEventListener('keyup', function (e) { keys[e.code] = false; });

  function tx(e) {
    var r = cv.getBoundingClientRect();
    return e.touches[0].clientX - r.left;
  }
  fit();
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); touchX = tx(e); }, { passive: false });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); touchX = tx(e); }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); touchX = null; }, { passive: false });
  cv.addEventListener('mousedown', function (e) {
    var r = cv.getBoundingClientRect(); touchX = e.clientX - r.left;
  });
  cv.addEventListener('mousemove', function (e) {
    if (touchX === null) return;
    var r = cv.getBoundingClientRect(); touchX = e.clientX - r.left;
  });
  window.addEventListener('mouseup', function () { touchX = null; });

  window.addEventListener('resize', function () {
    var wasRun = run;
    fit(); initBg();
    if (!wasRun) title();
  });

  $('bStart').addEventListener('click', start);
  $('bRetry').addEventListener('click', start);
  $('bChange').addEventListener('click', function () {
    vOver.classList.remove('on');
    vStart.classList.add('on');
    buildPicker();
    title();
  });
  bPause.addEventListener('click', pause);
  $('bResume').addEventListener('click', resume);
  $('bQuit').addEventListener('click', quitToTitle);
  $('bShop').addEventListener('click', openShop);
  $('bShopClose').addEventListener('click', closeShop);
  $('bTitles').addEventListener('click', openTitles);
  $('bTitlesClose').addEventListener('click', closeTitles);

  // ===== タイトルの絵 =====
  function title() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(96,78,156)'); g.addColorStop(1, 'rgb(252,168,98)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.arc(W * .24, H * .52, 30, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = .75; ctx.fillStyle = '#ffd2a6';
    for (var i = 0; i < 5; i++) {
      var cx = rnd(0, W), cy = rnd(H * .2, H * .62);
      ctx.beginPath();
      ctx.ellipse(cx, cy, 34, 12, 0, 0, 6.2832);
      ctx.ellipse(cx + 22, cy + 4, 20, 9, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    var x = -20;
    while (x < W + 20) {
      var w = rnd(26, 58), h = rnd(70, 200);
      ctx.fillStyle = '#2b2740';
      ctx.fillRect(x, H - h, w, h);
      x += w + rnd(3, 10);
    }
  }

  loadBest();
  applyChar();
  buildPicker();
  groundY = H - 30;
  title();
})();
</script>
